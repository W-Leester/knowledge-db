<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="lla" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#003F8A"/>
    </marker>
    <marker id="llg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00AA6C"/>
    </marker>
    <marker id="llr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect width="900" height="540" fill="#FAF7F2"/>
  <text x="450" y="36" font-size="20" font-weight="800" fill="#002C5F" text-anchor="middle">로컬 LLM 루프 속의 Judge — 스스로 재시도하는 에이전트</text>
  <text x="450" y="60" font-size="13" fill="#8A8A8A" text-anchor="middle">생성 → 판정 → 통과/재시도 — 루프 엔지니어링의 "검증자" 자리에 judge를 꽂는다</text>

  <!-- 요청 -->
  <rect x="30" y="120" width="150" height="60" rx="10" fill="#FFFFFF" stroke="#B5AFA5" stroke-width="1.5"/>
  <text x="105" y="146" font-size="12.5" font-weight="700" fill="#002C5F" text-anchor="middle">작업 요청</text>
  <text x="105" y="165" font-size="10.5" fill="#8A8A8A" text-anchor="middle">"이 코드 요약해줘"</text>

  <line x1="180" y1="150" x2="222" y2="150" stroke="#003F8A" stroke-width="2.2" marker-end="url(#lla)"/>

  <!-- 생성 모델 -->
  <rect x="226" y="108" width="200" height="84" rx="12" fill="#E8EEF7" stroke="#1A5CB5" stroke-width="2.5"/>
  <text x="326" y="136" font-size="13.5" font-weight="800" fill="#002C5F" text-anchor="middle">🏃 선수: 생성 모델</text>
  <text x="326" y="156" font-size="11" fill="#555555" text-anchor="middle">Qwen 등 로컬 모델</text>
  <text x="326" y="174" font-size="10.5" fill="#8A8A8A" text-anchor="middle">llama.cpp 서버 (포트 8080)</text>

  <line x1="426" y1="150" x2="468" y2="150" stroke="#003F8A" stroke-width="2.2" marker-end="url(#lla)"/>

  <!-- 출력 -->
  <rect x="472" y="120" width="130" height="60" rx="10" fill="#FFFFFF" stroke="#B5AFA5" stroke-width="1.5"/>
  <text x="537" y="146" font-size="12.5" font-weight="700" fill="#002C5F" text-anchor="middle">초안 출력</text>
  <text x="537" y="165" font-size="10.5" fill="#8A8A8A" text-anchor="middle">candidate</text>

  <line x1="602" y1="150" x2="644" y2="150" stroke="#003F8A" stroke-width="2.2" marker-end="url(#lla)"/>

  <!-- Judge -->
  <rect x="648" y="96" width="222" height="108" rx="12" fill="#F3E8FF" stroke="#6B21A8" stroke-width="2.5"/>
  <text x="759" y="124" font-size="13.5" font-weight="800" fill="#6B21A8" text-anchor="middle">⚖️ 심판: Judge 호출</text>
  <text x="759" y="144" font-size="11" fill="#555555" text-anchor="middle">기준표 + 요구사항 대조 채점</text>
  <text x="759" y="162" font-size="10.5" fill="#8A8A8A" text-anchor="middle">response_format: json_schema</text>
  <text x="759" y="180" font-size="10.5" fill="#8A8A8A" text-anchor="middle">→ {"pass": bool, "reason": …} 강제</text>
  <text x="759" y="196" font-size="10" fill="#8A8A8A" text-anchor="middle">temperature 0 · 같은 서버 재사용 가능</text>

  <!-- 판정 분기 -->
  <line x1="759" y1="204" x2="759" y2="248" stroke="#003F8A" stroke-width="2.2" marker-end="url(#lla)"/>
  <rect x="684" y="252" width="150" height="48" rx="24" fill="#0D1B2E"/>
  <text x="759" y="281" font-size="13" font-weight="800" fill="#FFF" text-anchor="middle">pass?</text>

  <!-- 통과 경로 -->
  <line x1="759" y1="300" x2="759" y2="344" stroke="#00AA6C" stroke-width="2.5" marker-end="url(#llg)"/>
  <text x="775" y="326" font-size="11.5" font-weight="800" fill="#065F46">true</text>
  <rect x="659" y="348" width="200" height="64" rx="12" fill="#E6F7F1" stroke="#00AA6C" stroke-width="2.5"/>
  <text x="759" y="376" font-size="13.5" font-weight="800" fill="#065F46" text-anchor="middle">✅ 사용자에게 전달</text>
  <text x="759" y="396" font-size="10.5" fill="#8A8A8A" text-anchor="middle">판정 로그는 평가셋에 축적</text>

  <!-- 재시도 경로 -->
  <line x1="684" y1="276" x2="360" y2="276" stroke="#DC2626" stroke-width="2.5"/>
  <text x="520" y="266" font-size="11.5" font-weight="800" fill="#DC2626" text-anchor="middle">false → 판정 근거(reason)를 피드백으로 첨부해 재생성</text>
  <line x1="360" y1="276" x2="326" y2="200" stroke="#DC2626" stroke-width="2.5" marker-end="url(#llr)"/>

  <!-- 재시도 상한 -->
  <rect x="60" y="252" width="240" height="76" rx="12" fill="#FEF3E2" stroke="#E8962A" stroke-width="2"/>
  <text x="180" y="278" font-size="12" font-weight="800" fill="#B45309" text-anchor="middle">🔁 재시도 상한 (예: 3회)</text>
  <text x="180" y="298" font-size="10.5" fill="#555555" text-anchor="middle">초과 시 무한 루프 대신 실패 보고</text>
  <text x="180" y="316" font-size="10.5" fill="#8A8A8A" text-anchor="middle">+ 매 재시도에 이전 판정 근거 누적</text>

  <!-- 구성 팁 -->
  <rect x="30" y="436" width="840" height="88" rx="12" fill="#0D1B2E"/>
  <text x="450" y="464" font-size="13" font-weight="800" fill="#FFF" text-anchor="middle">구성 3형: ① 같은 로컬 모델이 선수·심판 겸업(공짜, 자기 편애 주의 — 프롬프트·역할 분리)</text>
  <text x="450" y="488" font-size="12" fill="#8A9BB5" text-anchor="middle">② 로컬 모델 2개 — 큰 모델이 심판, 작은 모델이 선수 (VRAM 허용 시 가장 균형적)</text>
  <text x="450" y="510" font-size="12" fill="#8A9BB5" text-anchor="middle">③ 선수는 로컬, 심판만 클라우드 API — 판정 횟수가 적어 비용 미미, 심판 품질은 최고</text>
</svg>
