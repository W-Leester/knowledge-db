<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="jtl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#003F8A"/>
    </marker>
    <marker id="jtr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect width="900" height="620" fill="#FAF7F2"/>
  <text x="450" y="34" font-size="20" font-weight="800" fill="#002C5F" text-anchor="middle">왜 지금 FDE인가 — "마지막 1마일"이 길어졌다</text>
  <text x="450" y="58" font-size="13" fill="#666666" text-anchor="middle">모델은 범용인데 가치는 특수한 업무 맥락에서만 나온다 — 그 구간을 사람이 뚫는 전략</text>

  <!-- 파이프라인 -->
  <rect x="40" y="92" width="180" height="90" rx="12" fill="#E8EEF7" stroke="#1A5CB5" stroke-width="2"/>
  <text x="130" y="120" font-size="13" font-weight="800" fill="#002C5F" text-anchor="middle">파운데이션 모델</text>
  <text x="130" y="142" font-size="10" fill="#555555" text-anchor="middle">범용 능력 — 강력하지만</text>
  <text x="130" y="160" font-size="10" fill="#555555" text-anchor="middle">아무 업무에도 특화돼 있지 않다</text>
  <text x="130" y="176" font-size="9.5" fill="#666666" text-anchor="middle">여기까지가 AI 랩의 몫</text>

  <line x1="220" y1="137" x2="256" y2="137" stroke="#003F8A" stroke-width="2.5" marker-end="url(#jtl)"/>

  <rect x="260" y="92" width="180" height="90" rx="12" fill="#E6F7F1" stroke="#0F766E" stroke-width="2"/>
  <text x="350" y="120" font-size="13" font-weight="800" fill="#0F766E" text-anchor="middle">제품 (플랫폼)</text>
  <text x="350" y="142" font-size="10" fill="#555555" text-anchor="middle">API · 에이전트 · 대시보드</text>
  <text x="350" y="160" font-size="10" fill="#555555" text-anchor="middle">일반적인 기능은 갖춰져 있다</text>
  <text x="350" y="176" font-size="9.5" fill="#666666" text-anchor="middle">여기까지가 제품팀의 몫</text>

  <!-- 마지막 1마일 -->
  <rect x="480" y="84" width="240" height="106" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="3.5"/>
  <text x="600" y="112" font-size="13.5" font-weight="800" fill="#DC2626" text-anchor="middle">⚠️ 마지막 1마일</text>
  <text x="600" y="134" font-size="10" fill="#555555" text-anchor="middle">이 회사의 데이터 형식 · 레거시 시스템</text>
  <text x="600" y="152" font-size="10" fill="#555555" text-anchor="middle">현장의 업무 순서 · 예외 처리 규칙</text>
  <text x="600" y="170" font-size="10" fill="#555555" text-anchor="middle">담당자의 손버릇 · 조직의 승인 절차</text>
  <text x="600" y="185" font-size="9.5" font-weight="700" fill="#DC2626" text-anchor="middle">누구의 몫도 아니었던 구간</text>

  <line x1="720" y1="137" x2="756" y2="137" stroke="#003F8A" stroke-width="2.5" marker-end="url(#jtl)"/>

  <rect x="760" y="92" width="110" height="90" rx="12" fill="#0D1B2E"/>
  <text x="815" y="126" font-size="12" font-weight="800" fill="#FFF" text-anchor="middle">실제 가치</text>
  <text x="815" y="148" font-size="9.5" fill="#AAB9CF" text-anchor="middle">업무가 실제로</text>
  <text x="815" y="164" font-size="9.5" fill="#AAB9CF" text-anchor="middle">바뀌는 지점</text>

  <!-- 실패 경로 -->
  <path d="M 600 190 C 600 240 460 250 420 254" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#jtr)"/>
  <rect x="120" y="230" width="300" height="76" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="270" y="256" font-size="12.5" font-weight="800" fill="#DC2626" text-anchor="middle">여기서 막히면 = 파일럿 실패</text>
  <text x="270" y="278" font-size="10.5" fill="#555555" text-anchor="middle">"모델은 인상적인데 우리 업무엔 안 맞네요"</text>
  <text x="270" y="296" font-size="10" fill="#666666" text-anchor="middle">엔터프라이즈 AI 도입 실패의 주된 원인으로 지목된다</text>

  <!-- 두 가지 해법 -->
  <text x="450" y="346" font-size="15" font-weight="800" fill="#002C5F" text-anchor="middle">이 구간을 누가 뚫는가 — 두 가지 답</text>

  <rect x="60" y="364" width="380" height="150" rx="14" fill="#FEF3E2" stroke="#E8962A" stroke-width="3"/>
  <text x="250" y="392" font-size="13.5" font-weight="800" fill="#B45309" text-anchor="middle">답 ① 엔지니어를 현장에 보낸다</text>
  <text x="250" y="414" font-size="11" font-weight="700" fill="#002C5F" text-anchor="middle">= FDE (외부 → 내부)</text>
  <text x="80" y="440" font-size="10.5" fill="#555555">· 기술은 이미 있고, 도메인을 배운다</text>
  <text x="80" y="460" font-size="10.5" fill="#555555">· 배운 패턴을 <u>제품으로 역류</u>시킨다</text>
  <text x="80" y="480" font-size="10.5" fill="#555555">· 다음 고객은 더 싸게 — 학습이 자산이 된다</text>
  <text x="80" y="502" font-size="10" font-weight="700" fill="#B45309">비용: 도메인 흡수에 수개월 + 높은 인건비</text>

  <rect x="460" y="364" width="380" height="150" rx="14" fill="#E6F7F1" stroke="#0F766E" stroke-width="3"/>
  <text x="650" y="392" font-size="13.5" font-weight="800" fill="#0F766E" text-anchor="middle">답 ② 현장 사람에게 기술을 준다</text>
  <text x="650" y="414" font-size="11" font-weight="700" fill="#002C5F" text-anchor="middle">= 도메인 전문가 + 바이브코딩 (내부에서)</text>
  <text x="480" y="440" font-size="10.5" fill="#555555">· 도메인은 이미 있고, 구현 능력을 얻는다</text>
  <text x="480" y="460" font-size="10.5" fill="#555555">· 처음부터 현장 안에 있어 <u>발굴 비용 0</u></text>
  <text x="480" y="480" font-size="10.5" fill="#555555">· AI 도구가 구현 단가를 끌어내려 가능해졌다</text>
  <text x="480" y="502" font-size="10" font-weight="700" fill="#0F766E">비용: 코딩 습득 수주 + 책임 경계의 한계 (§2)</text>

  <!-- 하단 -->
  <rect x="30" y="534" width="840" height="72" rx="12" fill="#0D1B2E"/>
  <text x="450" y="560" font-size="12.5" font-weight="800" fill="#FFF" text-anchor="middle">둘은 경쟁이 아니라 같은 병목에 대한 반대 방향 접근이다 — 그리고 도착점이 같다</text>
  <text x="450" y="582" font-size="11" fill="#AAB9CF" text-anchor="middle">"도메인을 알면서 직접 만들 수 있는 사람" — 이 조합이 희소해서 FDE가 비싸고, 그래서 ②의 경로가 값진 것이다</text>
  <text x="450" y="600" font-size="10.5" fill="#7FD1A8" text-anchor="middle">코드 생산이 싸질수록 "무엇을 만들어야 하는지 아는 것"이 희소 자산이 된다</text>
</svg>
