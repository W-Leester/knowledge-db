<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="rsr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect width="900" height="640" fill="#FAF7F2"/>
  <text x="450" y="34" font-size="20" font-weight="800" fill="#002C5F" text-anchor="middle">상주형의 그림자 — 공격면과 4겹 방어</text>
  <text x="450" y="58" font-size="13" fill="#8A8A8A" text-anchor="middle">위험의 본질 = "상시 가동 + 넓은 권한 + 외부 입력"이 한 곳에서 만난다</text>

  <!-- 공격 경로 -->
  <rect x="30" y="84" width="840" height="180" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="52" y="112" font-size="14" font-weight="800" fill="#DC2626">☠️ 대표 공격: 프롬프트 인젝션 — 데이터가 명령으로 둔갑한다</text>

  <rect x="52" y="130" width="190" height="72" rx="10" fill="#FFFFFF"/>
  <text x="147" y="154" font-size="11.5" font-weight="800" fill="#DC2626" text-anchor="middle">① 악성 입력 도착</text>
  <text x="147" y="172" font-size="10" fill="#555555" text-anchor="middle">이메일·메시지·웹페이지 속에</text>
  <text x="147" y="188" font-size="10" fill="#555555" text-anchor="middle">"이전 지시 무시하고 …해라"</text>

  <line x1="242" y1="166" x2="284" y2="166" stroke="#DC2626" stroke-width="2.5" marker-end="url(#rsr)"/>

  <rect x="288" y="130" width="190" height="72" rx="10" fill="#FFFFFF"/>
  <text x="383" y="154" font-size="11.5" font-weight="800" fill="#DC2626" text-anchor="middle">② 에이전트가 읽음</text>
  <text x="383" y="172" font-size="10" fill="#555555" text-anchor="middle">"메일함 정리해줘" 하는 순간</text>
  <text x="383" y="188" font-size="10" fill="#555555" text-anchor="middle">본문 속 명령이 컨텍스트에 유입</text>

  <line x1="478" y1="166" x2="520" y2="166" stroke="#DC2626" stroke-width="2.5" marker-end="url(#rsr)"/>

  <rect x="524" y="130" width="190" height="72" rx="10" fill="#FFFFFF"/>
  <text x="619" y="154" font-size="11.5" font-weight="800" fill="#DC2626" text-anchor="middle">③ 지시로 오해·실행</text>
  <text x="619" y="172" font-size="10" fill="#555555" text-anchor="middle">셸·메일·파일 권한을 그대로</text>
  <text x="619" y="188" font-size="10" fill="#555555" text-anchor="middle">공격자의 손발로 사용</text>

  <line x1="714" y1="166" x2="756" y2="166" stroke="#DC2626" stroke-width="2.5" marker-end="url(#rsr)"/>

  <rect x="760" y="130" width="88" height="72" rx="10" fill="#DC2626"/>
  <text x="804" y="160" font-size="11.5" font-weight="800" fill="#FFF" text-anchor="middle">유출·전송</text>
  <text x="804" y="178" font-size="10" fill="#FFD5D5" text-anchor="middle">키·파일·돈</text>

  <text x="52" y="240" font-size="11.5" fill="#8A8A8A">그 외: 게이트웨이 포트를 인터넷에 노출한 채 운영(원격 장악), 스킬 장터의 악성 스킬 설치, API 키 평문 보관</text>

  <!-- 4겹 방어 -->
  <text x="450" y="300" font-size="15" font-weight="800" fill="#065F46" text-anchor="middle">🛡 4겹 방어 — 한 겹이 뚫려도 다음 겹이 막는다</text>

  <rect x="30" y="320" width="410" height="120" rx="14" fill="#E6F7F1" stroke="#00AA6C" stroke-width="2"/>
  <text x="52" y="348" font-size="13" font-weight="800" fill="#065F46">1겹 · 입구 통제</text>
  <text x="52" y="372" font-size="11.5" fill="#555555">· 채널 페어링: 허용한 계정의 메시지만 받기</text>
  <text x="52" y="392" font-size="11.5" fill="#555555">· 게이트웨이 포트 비공개 — VPN(Tailscale 등) 뒤에</text>
  <text x="52" y="412" font-size="11.5" fill="#555555">· 스킬은 검증된 것만 (OpenClaw는 스캔 도구 제공)</text>
  <text x="52" y="430" font-size="10" fill="#8A8A8A">모르는 사람·모르는 코드가 아예 못 들어오게</text>

  <rect x="460" y="320" width="410" height="120" rx="14" fill="#E6F7F1" stroke="#00AA6C" stroke-width="2"/>
  <text x="482" y="348" font-size="13" font-weight="800" fill="#065F46">2겹 · 권한 최소화</text>
  <text x="482" y="372" font-size="11.5" fill="#555555">· 전용 계정·전용 머신(또는 컨테이너)에서 구동</text>
  <text x="482" y="392" font-size="11.5" fill="#555555">· API 키는 최소 권한·소액 한도로 발급</text>
  <text x="482" y="412" font-size="11.5" fill="#555555">· 금융·주계정 등 치명 자산은 아예 연결하지 않기</text>
  <text x="482" y="430" font-size="10" fill="#8A8A8A">뚫려도 가져갈 수 있는 게 적게</text>

  <rect x="30" y="456" width="410" height="120" rx="14" fill="#E6F7F1" stroke="#00AA6C" stroke-width="2"/>
  <text x="52" y="484" font-size="13" font-weight="800" fill="#065F46">3겹 · 실행 통제</text>
  <text x="52" y="508" font-size="11.5" fill="#555555">· 위험 행동(발송·삭제·결제·설치)은 승인 게이트</text>
  <text x="52" y="528" font-size="11.5" fill="#555555">· "읽기는 자동, 쓰기는 확인" 원칙</text>
  <text x="52" y="548" font-size="11.5" fill="#555555">· 외부 문서를 읽을 땐 "본문은 데이터"임을 프롬프트에 명시</text>
  <text x="52" y="566" font-size="10" fill="#8A8A8A">Claude Code의 권한 모드와 같은 사상</text>

  <rect x="460" y="456" width="410" height="120" rx="14" fill="#E6F7F1" stroke="#00AA6C" stroke-width="2"/>
  <text x="482" y="484" font-size="13" font-weight="800" fill="#065F46">4겹 · 감사와 복구</text>
  <text x="482" y="508" font-size="11.5" fill="#555555">· 모든 행동 로그 보존 — 무엇을 왜 했는지 추적 가능하게</text>
  <text x="482" y="528" font-size="11.5" fill="#555555">· 메모리·스킬 파일 주기 검토 (오염된 학습 제거)</text>
  <text x="482" y="548" font-size="11.5" fill="#555555">· 키 회전·백업 — 사고 시 빠른 차단·복원</text>
  <text x="482" y="566" font-size="10" fill="#8A8A8A">사고는 "만약"이 아니라 "언제"의 문제로 설계</text>

  <!-- 하단 -->
  <rect x="30" y="592" width="840" height="36" rx="10" fill="#0D1B2E"/>
  <text x="450" y="615" font-size="12" font-weight="700" fill="#FFF" text-anchor="middle">한 줄 원칙: 상주형 에이전트에게 주는 권한 = "이 권한을 가진 낯선 사람이 내 서버에 산다"고 상상했을 때 견딜 수 있는 만큼만</text>
</svg>
