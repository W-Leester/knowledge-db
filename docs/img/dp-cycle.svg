<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="dca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#003F8A"/>
    </marker>
    <marker id="dcr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect width="900" height="620" fill="#FAF7F2"/>
  <text x="450" y="34" font-size="20" font-weight="800" fill="#002C5F" text-anchor="middle">실전 순서 — 앞은 한 번, 가운데는 기능마다 반복, 뒤는 마무리</text>
  <text x="450" y="58" font-size="13" fill="#8A8A8A" text-anchor="middle">핵심은 가운데의 "기능 단위 사이클" — 작게 자를수록 AI와의 협업이 안정된다</text>

  <!-- 준비 단계 (한 번) -->
  <text x="180" y="96" font-size="12.5" font-weight="800" fill="#8A8A8A" text-anchor="middle">프로젝트당 한 번</text>
  <rect x="40" y="106" width="280" height="60" rx="12" fill="#E8EEF7" stroke="#1A5CB5" stroke-width="2"/>
  <text x="180" y="130" font-size="12.5" font-weight="800" fill="#002C5F" text-anchor="middle">① 의도 정의</text>
  <text x="180" y="152" font-size="10" fill="#555555" text-anchor="middle">무엇을·누구를 위해·수용 기준 — 스펙 문서</text>

  <line x1="180" y1="166" x2="180" y2="186" stroke="#003F8A" stroke-width="2.2" marker-end="url(#dca)"/>
  <rect x="40" y="190" width="280" height="60" rx="12" fill="#E8EEF7" stroke="#1A5CB5" stroke-width="2"/>
  <text x="180" y="214" font-size="12.5" font-weight="800" fill="#002C5F" text-anchor="middle">② 설계 대화</text>
  <text x="180" y="236" font-size="10" fill="#555555" text-anchor="middle">AI와 옵션 비교 → 스택·구조 결정 (플랜 모드)</text>

  <line x1="180" y1="250" x2="180" y2="270" stroke="#003F8A" stroke-width="2.2" marker-end="url(#dca)"/>
  <rect x="40" y="274" width="280" height="60" rx="12" fill="#E8EEF7" stroke="#1A5CB5" stroke-width="2"/>
  <text x="180" y="298" font-size="12.5" font-weight="800" fill="#002C5F" text-anchor="middle">③ 뼈대 생성 + 규칙 파일</text>
  <text x="180" y="320" font-size="10" fill="#555555" text-anchor="middle">스캐폴드 · CLAUDE.md급 규칙 · CI 게이트 준비</text>

  <line x1="320" y1="304" x2="392" y2="304" stroke="#003F8A" stroke-width="2.5" marker-end="url(#dca)"/>

  <!-- 기능 단위 사이클 -->
  <rect x="396" y="90" width="464" height="430" rx="16" fill="#FFFFFF" stroke="#9F1239" stroke-width="2.5"/>
  <text x="628" y="120" font-size="14" font-weight="800" fill="#9F1239" text-anchor="middle">④ 기능 단위 사이클 — 기능마다 반복</text>

  <rect x="428" y="138" width="400" height="54" rx="10" fill="#FEF3E2" stroke="#E8962A" stroke-width="1.8"/>
  <text x="628" y="160" font-size="12" font-weight="800" fill="#B45309" text-anchor="middle">④-1 과녁 세우기</text>
  <text x="628" y="180" font-size="10" fill="#555555" text-anchor="middle">이 기능의 수용 기준 → 테스트로 먼저 (한 입 크기로 자르기)</text>

  <line x1="628" y1="192" x2="628" y2="208" stroke="#003F8A" stroke-width="2" marker-end="url(#dca)"/>
  <rect x="428" y="212" width="400" height="54" rx="10" fill="#E8EEF7" stroke="#1A5CB5" stroke-width="1.8"/>
  <text x="628" y="234" font-size="12" font-weight="800" fill="#002C5F" text-anchor="middle">④-2 생성 (LLM)</text>
  <text x="628" y="254" font-size="10" fill="#555555" text-anchor="middle">컨텍스트 수집 → 계획 → 편집 — 에이전트의 내부 루프 (§3)</text>

  <line x1="628" y1="266" x2="628" y2="282" stroke="#003F8A" stroke-width="2" marker-end="url(#dca)"/>
  <rect x="428" y="286" width="400" height="54" rx="10" fill="#E6F7F1" stroke="#00AA6C" stroke-width="1.8"/>
  <text x="628" y="308" font-size="12" font-weight="800" fill="#065F46" text-anchor="middle">④-3 기계 검증</text>
  <text x="628" y="328" font-size="10" fill="#555555" text-anchor="middle">실행·테스트·린트 — 통과할 때까지 AI가 스스로 수정</text>

  <line x1="628" y1="340" x2="628" y2="356" stroke="#003F8A" stroke-width="2" marker-end="url(#dca)"/>
  <rect x="428" y="360" width="400" height="54" rx="10" fill="#F3E8FF" stroke="#6B21A8" stroke-width="1.8"/>
  <text x="628" y="382" font-size="12" font-weight="800" fill="#6B21A8" text-anchor="middle">④-4 리뷰 (AI 1차 → 사람 최종)</text>
  <text x="628" y="402" font-size="10" fill="#555555" text-anchor="middle">diff 읽기 — 요구 부합·경계 조건·보안 (§4의 피라미드)</text>

  <line x1="628" y1="414" x2="628" y2="430" stroke="#003F8A" stroke-width="2" marker-end="url(#dca)"/>
  <rect x="428" y="434" width="400" height="48" rx="10" fill="#0D1B2E"/>
  <text x="628" y="456" font-size="12" font-weight="800" fill="#7FD1A8" text-anchor="middle">④-5 커밋 — 작동하는 상태를 저장</text>
  <text x="628" y="473" font-size="9.5" fill="#8A9BB5" text-anchor="middle">되돌릴 지점 확보 — 다음 기능으로</text>

  <!-- 리뷰 실패 화살표 -->
  <path d="M 428 387 L 404 387 L 404 239 L 424 239" fill="none" stroke="#DC2626" stroke-width="2.2" marker-end="url(#dcr)"/>
  <text x="411" y="310" font-size="9.5" font-weight="700" fill="#DC2626" text-anchor="middle" transform="rotate(-90 411 310)">불합격 → 피드백과 함께 재생성</text>

  <!-- 반복 표시 -->
  <path d="M 828 460 C 870 460 870 165 832 165" fill="none" stroke="#9F1239" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#dca)"/>
  <text x="874" y="315" font-size="10" font-weight="700" fill="#9F1239" text-anchor="middle" transform="rotate(90 874 315)">다음 기능으로 반복</text>

  <!-- 마무리 -->
  <line x1="180" y1="334" x2="180" y2="360" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="40" y="364" width="280" height="60" rx="12" fill="#FEF3E2" stroke="#E8962A" stroke-width="2"/>
  <text x="180" y="388" font-size="12.5" font-weight="800" fill="#B45309" text-anchor="middle">⑤ 다듬기 (주기적)</text>
  <text x="180" y="410" font-size="10" fill="#555555" text-anchor="middle">리팩토링·문서화·의존성 정리 — AI에게 맡기기 좋은 일</text>

  <line x1="180" y1="424" x2="180" y2="444" stroke="#003F8A" stroke-width="2.2" marker-end="url(#dca)"/>
  <rect x="40" y="448" width="280" height="60" rx="12" fill="#E6F7F1" stroke="#00AA6C" stroke-width="2"/>
  <text x="180" y="472" font-size="12.5" font-weight="800" fill="#065F46" text-anchor="middle">⑥ 배포 — 사람이 누른다</text>
  <text x="180" y="494" font-size="10" fill="#555555" text-anchor="middle">main 병합·릴리스는 언제나 사람의 승인</text>

  <!-- 하단 -->
  <rect x="40" y="544" width="820" height="56" rx="12" fill="#0D1B2E"/>
  <text x="450" y="568" font-size="12.5" font-weight="800" fill="#FFF" text-anchor="middle">이 사이클을 사람이 돌리면 "AI 짝코딩", 스크립트가 돌리면 「로컬 LLM 코딩 공장」의 목표 루프 — 구조는 같다</text>
  <text x="450" y="590" font-size="11" fill="#8A9BB5" text-anchor="middle">단위를 작게 자르는 것이 전부다 — 한 사이클이 커지면 검증 불가능한 diff가 쏟아진다</text>
</svg>
