<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="rsa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B21A8"/>
    </marker>
    <marker id="rsg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00AA6C"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#FAF7F2"/>
  <text x="450" y="34" font-size="20" font-weight="800" fill="#002C5F" text-anchor="middle">자기 개선 루프 — 에이전트가 스스로 스킬을 쓴다</text>
  <text x="450" y="58" font-size="13" fill="#8A8A8A" text-anchor="middle">Hermes의 핵심 차별점 — "재귀적 발전 루프 엔지니어링"이 제품이 된 모습</text>

  <!-- 루프 단계들 (원형 배치 대신 사각 루프) -->
  <rect x="60" y="100" width="220" height="80" rx="12" fill="#E8EEF7" stroke="#1A5CB5" stroke-width="2"/>
  <text x="170" y="130" font-size="13" font-weight="800" fill="#002C5F" text-anchor="middle">① 작업 수행</text>
  <text x="170" y="152" font-size="11" fill="#555555" text-anchor="middle">"매주 경비 정리해서 시트에"</text>
  <text x="170" y="169" font-size="10" fill="#8A8A8A" text-anchor="middle">시행착오 포함 — 처음엔 느리다</text>

  <line x1="280" y1="140" x2="330" y2="140" stroke="#6B21A8" stroke-width="2.5" marker-end="url(#rsa)"/>

  <rect x="334" y="100" width="220" height="80" rx="12" fill="#FEF3E2" stroke="#E8962A" stroke-width="2"/>
  <text x="444" y="130" font-size="13" font-weight="800" fill="#B45309" text-anchor="middle">② 패턴 감지</text>
  <text x="444" y="152" font-size="11" fill="#555555" text-anchor="middle">"이 작업, 반복되고 있다"</text>
  <text x="444" y="169" font-size="10" fill="#8A8A8A" text-anchor="middle">같은 절차·같은 도구·같은 형식</text>

  <line x1="554" y1="140" x2="604" y2="140" stroke="#6B21A8" stroke-width="2.5" marker-end="url(#rsa)"/>

  <rect x="608" y="100" width="240" height="80" rx="12" fill="#F3E8FF" stroke="#6B21A8" stroke-width="2.5"/>
  <text x="728" y="130" font-size="13" font-weight="800" fill="#6B21A8" text-anchor="middle">③ 스킬 파일 작성</text>
  <text x="728" y="152" font-size="10.5" fill="#555555" text-anchor="middle" font-family="'JetBrains Mono', monospace">~/.hermes/skills/expense.md</text>
  <text x="728" y="169" font-size="10" fill="#8A8A8A" text-anchor="middle">절차·주의점·도구 순서를 문서로 굳힘</text>

  <line x1="728" y1="180" x2="728" y2="240" stroke="#6B21A8" stroke-width="2.5" marker-end="url(#rsa)"/>

  <rect x="608" y="244" width="240" height="80" rx="12" fill="#E6F7F1" stroke="#00AA6C" stroke-width="2"/>
  <text x="728" y="274" font-size="13" font-weight="800" fill="#065F46" text-anchor="middle">④ 다음 요청 때 스킬 로드</text>
  <text x="728" y="296" font-size="11" fill="#555555" text-anchor="middle">시행착오 없이 굳힌 절차대로</text>
  <text x="728" y="313" font-size="10" fill="#8A8A8A" text-anchor="middle">더 빠르고, 더 일관되게</text>

  <line x1="608" y1="284" x2="290 " y2="284" stroke="#00AA6C" stroke-width="2.5"/>
  <line x1="290" y1="284" x2="212" y2="188" stroke="#00AA6C" stroke-width="2.5" marker-end="url(#rsg)"/>
  <text x="430" y="272" font-size="11.5" font-weight="700" fill="#065F46" text-anchor="middle">⑤ 루프 반복 — 쓸수록 스킬 서랍이 두꺼워진다</text>

  <!-- 비교: 정적 vs 누적 -->
  <rect x="60" y="360" width="390" height="120" rx="14" fill="#FFFFFF" stroke="#B5AFA5" stroke-width="1.5"/>
  <text x="255" y="388" font-size="13" font-weight="800" fill="#555555" text-anchor="middle">기존 도구 — 성능이 수평선</text>
  <line x1="90" y1="450" x2="420" y2="450" stroke="#8A8A8A" stroke-width="2.5"/>
  <text x="255" y="470" font-size="10.5" fill="#8A8A8A" text-anchor="middle">100번째 요청도 첫 요청과 같은 수준 (세션마다 초기화)</text>

  <rect x="470" y="360" width="390" height="120" rx="14" fill="#F3E8FF" stroke="#6B21A8" stroke-width="2"/>
  <text x="665" y="388" font-size="13" font-weight="800" fill="#6B21A8" text-anchor="middle">자기 개선 에이전트 — 우상향 계단</text>
  <path d="M500,462 L560,462 L560,448 L620,448 L620,436 L690,436 L690,422 L760,422 L760,410 L830,410" fill="none" stroke="#6B21A8" stroke-width="2.5"/>
  <text x="665" y="470" font-size="10.5" fill="#8A8A8A" text-anchor="middle" transform="translate(0,8)">스킬이 쌓일 때마다 한 계단씩 — 오래 쓸수록 나만의 에이전트가 된다</text>

  <!-- 하단 -->
  <rect x="30" y="500" width="840" height="44" rx="12" fill="#0D1B2E"/>
  <text x="450" y="528" font-size="12.5" font-weight="700" fill="#FFF" text-anchor="middle">주의: 스스로 쓴 스킬은 스스로 실행한다 — 잘못 배운 절차도 굳는다. 스킬 파일을 주기적으로 사람이 검토하는 것이 안전장치 (§6)</text>
</svg>
