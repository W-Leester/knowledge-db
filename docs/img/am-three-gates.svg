<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="ama" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#003F8A"/>
    </marker>
  </defs>
  <rect width="900" height="620" fill="#FAF7F2"/>
  <text x="450" y="34" font-size="20" font-weight="800" fill="#002C5F" text-anchor="middle">앱에 들어가는 것들 — 세 개의 층</text>
  <text x="450" y="58" font-size="13" fill="#666666" text-anchor="middle">아래층이 비면 출시가 안 되고, 가운데가 비면 운영이 안 되고, 위층이 비면 품질이 안 된다</text>

  <!-- 3층 (위) -->
  <rect x="150" y="84" width="600" height="130" rx="14" fill="#E6F7F1" stroke="#00AA6C" stroke-width="2"/>
  <text x="450" y="112" font-size="14" font-weight="800" fill="#065F46" text-anchor="middle">3층 · 품질의 플러스 — 넣으면 좋은 것</text>
  <text x="450" y="138" font-size="10.5" fill="#555555" text-anchor="middle">인앱 리뷰 요청 · 알림 세분화 · 온보딩·빈 화면 · 데이터 내보내기</text>
  <text x="450" y="158" font-size="10.5" fill="#555555" text-anchor="middle">What's New · 접근성 · 딥링크 · 법적 문서 버전 관리</text>
  <text x="450" y="184" font-size="10" font-weight="700" fill="#065F46" text-anchor="middle">없어도 출시는 된다 — 그러나 별점과 재방문율이 여기서 갈린다 (§4)</text>

  <!-- 2층 -->
  <rect x="100" y="230" width="700" height="150" rx="14" fill="#FEF3E2" stroke="#E8962A" stroke-width="2.5"/>
  <text x="450" y="258" font-size="14" font-weight="800" fill="#B45309" text-anchor="middle">2층 · 운영의 필수 — 없으면 출시 후에 무너진다</text>
  <text x="450" y="284" font-size="10.5" fill="#555555" text-anchor="middle">버전·빌드 번호 표시 · 문의 창구 · 크래시 리포팅 · 네트워크 오류 화면</text>
  <text x="450" y="306" font-size="11" font-weight="700" fill="#DC2626" text-anchor="middle">★ 강제 업데이트 장치 · 점검 모드 플래그 (§3의 심장)</text>
  <text x="450" y="330" font-size="10" fill="#666666" text-anchor="middle">웹과 달리 앱은 구버전이 영원히 살아있다 — 서버를 바꾸는 순간 구버전이 깨진다</text>
  <text x="450" y="352" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">심사는 통과한다 — 그러나 첫 서버 변경일에 사고가 난다 (§3)</text>

  <!-- 1층 (바닥) -->
  <rect x="50" y="396" width="800" height="150" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/>
  <text x="450" y="424" font-size="14" font-weight="800" fill="#DC2626" text-anchor="middle">1층 · 출시의 전제 — 법·스토어 정책 의무 (없으면 심사 거절·제재)</text>
  <text x="450" y="450" font-size="10.5" fill="#555555" text-anchor="middle">개인정보처리방침 (앱 내 + 스토어 등록, 수집 신고와 일치) · 계정 삭제 기능 (앱 안에서)</text>
  <text x="450" y="472" font-size="10.5" fill="#555555" text-anchor="middle">오픈소스 라이선스 고지 화면 · 이용약관 · 인앱결제 규정 (외부 결제 유도 금지)</text>
  <text x="450" y="494" font-size="10.5" fill="#555555" text-anchor="middle">사업자 정보 (한국·유료) · 연령 등급 (실제 콘텐츠와 일치)</text>
  <text x="450" y="522" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle">기능이 아니라 출시의 전제 조건 — 마지막 주가 아니라 첫 버전 설계에 포함할 것 (§2)</text>

  <!-- 옆 화살표 -->
  <line x1="862" y1="500" x2="862" y2="140" stroke="#8A8478" stroke-width="2.5" marker-end="url(#ama)"/>
  <text x="880" y="480" font-size="10.5" font-weight="800" fill="#DC2626" text-anchor="end" transform="rotate(-90 880 480)"> </text>

  <!-- 하단 -->
  <rect x="30" y="566" width="840" height="42" rx="12" fill="#0D1B2E"/>
  <text x="450" y="592" font-size="12.5" font-weight="800" fill="#FFF" text-anchor="middle">읽는 법: 1층은 심사관이 보고 · 2층은 운영자(나)가 겪고 · 3층은 사용자가 느낀다</text>
</svg>
