<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="rq3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#003F8A"/>
    </marker>
  </defs>
  <rect width="900" height="720" fill="#FAF7F2"/>
  <text x="450" y="34" font-size="20" font-weight="800" fill="#002C5F" text-anchor="middle">요구사항의 세 층위 — 그리고 각 층을 담는 문서</text>
  <text x="450" y="58" font-size="13" fill="#666666" text-anchor="middle">실무 혼란의 대부분은 이 층들을 한 문서에 섞어 쓰는 데서 온다 — 층마다 답하는 질문과 독자가 다르다</text>

  <!-- 층 1 -->
  <rect x="40" y="86" width="540" height="118" rx="14" fill="#F3E8FF" stroke="#6B21A8" stroke-width="2.5"/>
  <text x="62" y="114" font-size="14" font-weight="800" fill="#6B21A8">① 비즈니스 요구사항 — "왜 만드는가"</text>
  <text x="62" y="138" font-size="10.5" fill="#555555">독자: 경영·기획 · 언어: 목표와 지표</text>
  <text x="62" y="160" font-size="10.5" fill="#555555">예: "업계 동향 파악에 드는 시간을 주당 5시간에서 1시간으로 줄인다"</text>
  <text x="62" y="184" font-size="10" font-weight="700" fill="#6B21A8">성공 지표가 숫자로 적혀야 한다 — 이것이 나중에 "완성됐나"를 판정하는 유일한 근거</text>

  <rect x="600" y="86" width="270" height="118" rx="14" fill="#FFFFFF" stroke="#6B21A8" stroke-width="2"/>
  <text x="735" y="114" font-size="12" font-weight="800" fill="#6B21A8" text-anchor="middle">📄 비전과 범위 문서</text>
  <text x="620" y="138" font-size="9.5" fill="#555555">비전 선언문 · 비즈니스 목표·성공 지표</text>
  <text x="620" y="156" font-size="9.5" fill="#555555">범위 안 / 범위 밖 · 컨텍스트 다이어그램</text>
  <text x="620" y="174" font-size="9.5" fill="#555555">이해관계자 · 제약 · 가정</text>
  <text x="620" y="194" font-size="9" fill="#666666">"범위 밖"을 적는 것이 범위 안만큼 중요</text>

  <line x1="310" y1="204" x2="310" y2="228" stroke="#003F8A" stroke-width="2.5" marker-end="url(#rq3)"/>

  <!-- 층 2 -->
  <rect x="40" y="232" width="540" height="118" rx="14" fill="#E8EEF7" stroke="#1A5CB5" stroke-width="2.5"/>
  <text x="62" y="260" font-size="14" font-weight="800" fill="#002C5F">② 사용자 요구사항 — "사용자가 무엇을 하려는가"</text>
  <text x="62" y="284" font-size="10.5" fill="#555555">독자: 사용자·기획·개발 모두 · 언어: 목표를 가진 사람의 행동</text>
  <text x="62" y="306" font-size="10.5" fill="#555555">예: "관심 키워드가 담긴 기사를 매일 아침 한눈에 본다"</text>
  <text x="62" y="330" font-size="10" font-weight="700" fill="#1A5CB5">사용자의 목표이지 화면 설계가 아니다 — "버튼을 누르면"이 나오면 층이 내려간 것</text>

  <rect x="600" y="232" width="270" height="118" rx="14" fill="#FFFFFF" stroke="#1A5CB5" stroke-width="2"/>
  <text x="735" y="260" font-size="12" font-weight="800" fill="#002C5F" text-anchor="middle">📄 유스케이스 · 유저 스토리</text>
  <text x="620" y="284" font-size="9.5" fill="#555555">유스케이스: 액터·사전조건·정상/대안/예외 흐름</text>
  <text x="620" y="302" font-size="9.5" fill="#555555">유저 스토리: As a / I want / so that</text>
  <text x="620" y="320" font-size="9.5" fill="#555555">+ 수용 기준 (Given / When / Then)</text>
  <text x="620" y="340" font-size="9" fill="#666666">예외가 중요하면 유스케이스, 속도가 중요하면 스토리</text>

  <line x1="310" y1="350" x2="310" y2="374" stroke="#003F8A" stroke-width="2.5" marker-end="url(#rq3)"/>

  <!-- 층 3 -->
  <rect x="40" y="378" width="540" height="150" rx="14" fill="#E6F7F1" stroke="#0F766E" stroke-width="2.5"/>
  <text x="62" y="406" font-size="14" font-weight="800" fill="#0F766E">③ 기능 요구사항 + 품질 속성 — "시스템이 무엇을, 얼마나 잘"</text>
  <text x="62" y="430" font-size="10.5" fill="#555555">독자: 개발·테스트 · 언어: "시스템은 ~해야 한다" (shall)</text>
  <text x="62" y="452" font-size="10.5" fill="#555555">기능: "시스템은 매일 07:00에 등록된 소스에서 신규 기사를 수집해야 한다"</text>
  <text x="62" y="472" font-size="10.5" fill="#555555">품질: "수집 100건 기준 3분 이내 완료" · "실패 시 자동 재시도 3회 후 관리자 알림"</text>
  <text x="62" y="498" font-size="10" font-weight="700" fill="#0F766E">둘 다 테스트로 참/거짓을 판정할 수 있어야 한다 — 검증 가능성이 이 층의 리트머스</text>
  <text x="62" y="516" font-size="9.5" fill="#666666">품질 속성은 "빠르게"가 아니라 척도·측정법·목표·최소치로 (§5-C)</text>

  <rect x="600" y="378" width="270" height="150" rx="14" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="735" y="406" font-size="12" font-weight="800" fill="#0F766E" text-anchor="middle">📄 SRS (소프트웨어 요구사항 명세)</text>
  <text x="620" y="430" font-size="9.5" fill="#555555">1 서론 · 2 전체 설명 · 3 시스템 기능</text>
  <text x="620" y="448" font-size="9.5" fill="#555555">4 외부 인터페이스 · 5 품질 속성 · 6 기타</text>
  <text x="620" y="466" font-size="9.5" fill="#555555">부록: 용어집 · 분석 모델 · 데이터 사전</text>
  <text x="620" y="490" font-size="9.5" font-weight="700" fill="#0F766E">+ 미결 사항(TBD) 목록 ★</text>
  <text x="620" y="508" font-size="9" fill="#666666">모르는 것을 모른다고 적는 칸 — 없으면</text>
  <text x="620" y="522" font-size="9" fill="#666666">모호함이 조용히 코드로 흘러든다</text>

  <!-- 경계선: 설계 -->
  <line x1="40" y1="552" x2="870" y2="552" stroke="#B91C1C" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="450" y="546" font-size="10.5" font-weight="800" fill="#B91C1C" text-anchor="middle">▲ 요구사항 = What (무엇) ｜ ▼ 설계 = How (어떻게) — 이 선을 넘지 않는다</text>

  <rect x="40" y="566" width="830" height="68" rx="12" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2"/>
  <text x="62" y="592" font-size="12" font-weight="800" fill="#B91C1C">요구사항으로 위장한 설계 — 가장 흔한 위반</text>
  <text x="62" y="614" font-size="10.5" fill="#555555">"PostgreSQL을 사용해야 한다"는 설계 결정이다. 진짜 요구사항은 "동시 사용자 1,000명을 지원해야 한다"쯤 — <tspan font-weight="700">"왜?"를 세 번 물어 What으로 환원</tspan>한다</text>

  <!-- 비즈니스 규칙 -->
  <rect x="40" y="648" width="830" height="60" rx="12" fill="#FEF3E2" stroke="#E8962A" stroke-width="2"/>
  <text x="62" y="672" font-size="12" font-weight="800" fill="#AF5109">따로 사는 것: 비즈니스 규칙</text>
  <text x="62" y="694" font-size="10.5" fill="#555555">"5만 원 이상 무료배송"은 규칙이지 요구사항이 아니다 — 규칙 목록을 별도로 두고 요구사항은 참조만. 규칙이 바뀌어도 요구사항을 다시 쓰지 않게</text>
</svg>
