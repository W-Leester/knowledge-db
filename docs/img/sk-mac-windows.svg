<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="skm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#003F8A"/>
    </marker>
  </defs>
  <rect width="900" height="700" fill="#FAF7F2"/>
  <text x="450" y="34" font-size="20" font-weight="800" fill="#002C5F" text-anchor="middle">맥의 두 경로와 윈도우의 대응물 — 같은 구조, 다른 이름</text>
  <text x="450" y="58" font-size="13" fill="#666666" text-anchor="middle">SDK를 얻는 공식 경로는 양쪽 다 둘뿐이다: IDE 전체를 받거나, 최소 툴체인만 받거나</text>

  <!-- 맥 -->
  <text x="235" y="92" font-size="14" font-weight="800" fill="#002C5F" text-anchor="middle">🍎 macOS</text>

  <rect x="40" y="104" width="390" height="176" rx="14" fill="#FFFFFF" stroke="#8A8478" stroke-width="2"/>
  <text x="62" y="130" font-size="12.5" font-weight="800" fill="#555555">경로 A · Xcode.app 전체 (수십 GB)</text>
  <text x="62" y="150" font-size="10" fill="#666666">/Applications/Xcode.app/Contents/Developer</text>
  <rect x="62" y="160" width="346" height="28" rx="6" fill="#F2EDE4"/>
  <text x="235" y="179" font-size="10" fill="#555555" text-anchor="middle">GUI 편집기 · Interface Builder · Instruments · 시뮬레이터 앱</text>
  <rect x="62" y="194" width="346" height="28" rx="6" fill="#F3E8FF"/>
  <text x="235" y="213" font-size="10" fill="#6B21A8" text-anchor="middle">툴체인: clang · swiftc · ld · lldb · xcodebuild</text>
  <rect x="62" y="228" width="346" height="28" rx="6" fill="#FEF3E2"/>
  <text x="235" y="247" font-size="10" fill="#AF5109" text-anchor="middle">SDK: macOS + iOS + watchOS + visionOS + tvOS</text>
  <text x="62" y="272" font-size="9.5" fill="#666666">Xcode 15부터 각 플랫폼 시뮬레이터 런타임은 별도 다운로드</text>

  <rect x="40" y="296" width="390" height="150" rx="14" fill="#E6F7F1" stroke="#0F766E" stroke-width="3"/>
  <text x="62" y="322" font-size="12.5" font-weight="800" fill="#0F766E">경로 B · Command Line Tools (수 GB) ★ 대부분의 사용자</text>
  <text x="62" y="342" font-size="10" fill="#666666">/Library/Developer/CommandLineTools</text>
  <rect x="62" y="352" width="346" height="28" rx="6" fill="#F3E8FF"/>
  <text x="235" y="371" font-size="10" fill="#6B21A8" text-anchor="middle">툴체인: clang(gcc는 이것의 별칭) · make · ld · lldb · git</text>
  <rect x="62" y="386" width="346" height="28" rx="6" fill="#FEF3E2"/>
  <text x="235" y="405" font-size="10" fill="#AF5109" text-anchor="middle">SDK: macOS 하나만 (SDKs/MacOSX.sdk)</text>
  <text x="62" y="432" font-size="10" font-weight="700" fill="#0F766E">GUI 없음 · 응용 프로그램 폴더에 안 보임 · 모바일 SDK 없음</text>

  <!-- xcode-select -->
  <rect x="40" y="462" width="390" height="96" rx="12" fill="#E8EEF7" stroke="#1A5CB5" stroke-width="2"/>
  <text x="62" y="488" font-size="12" font-weight="800" fill="#002C5F">xcode-select — 둘 중 어디를 볼지 가리키는 포인터</text>
  <text x="62" y="510" font-size="10" fill="#555555">CLT도 Xcode도 아닌 OS 내장 유틸리티. 터미널의 git·clang이</text>
  <text x="62" y="528" font-size="10" fill="#555555">A와 B 중 어느 폴더의 것을 실행할지 결정한다</text>
  <text x="62" y="548" font-size="9.5" fill="#1A5CB5" font-weight="700">-p 현재 경로 출력 · --install 설치 · -s 전환 · -r 초기화</text>
  <line x1="300" y1="462" x2="300" y2="450" stroke="#1A5CB5" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#skm)"/>
  <line x1="340" y1="462" x2="340" y2="284" stroke="#1A5CB5" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#skm)"/>

  <!-- 윈도우 -->
  <text x="665" y="92" font-size="14" font-weight="800" fill="#002C5F" text-anchor="middle">🪟 Windows</text>

  <rect x="470" y="104" width="390" height="176" rx="14" fill="#FFFFFF" stroke="#8A8478" stroke-width="2"/>
  <text x="492" y="130" font-size="12.5" font-weight="800" fill="#555555">경로 A · Visual Studio 전체</text>
  <text x="492" y="150" font-size="10" fill="#666666">C:\Program Files\Microsoft Visual Studio\…</text>
  <rect x="492" y="160" width="346" height="28" rx="6" fill="#F2EDE4"/>
  <text x="665" y="179" font-size="10" fill="#555555" text-anchor="middle">GUI 편집기 · 디자이너 · 프로파일러 · 에뮬레이터</text>
  <rect x="492" y="194" width="346" height="28" rx="6" fill="#F3E8FF"/>
  <text x="665" y="213" font-size="10" fill="#6B21A8" text-anchor="middle">툴체인: cl.exe · link.exe · MSBuild · nmake</text>
  <rect x="492" y="228" width="346" height="28" rx="6" fill="#FEF3E2"/>
  <text x="665" y="247" font-size="10" fill="#AF5109" text-anchor="middle">SDK: Windows SDK (+ 선택한 워크로드별 SDK)</text>
  <text x="492" y="272" font-size="9.5" fill="#666666">설치 관리자에서 "워크로드"를 고르는 것이 SDK 선택</text>

  <rect x="470" y="296" width="390" height="150" rx="14" fill="#E6F7F1" stroke="#0F766E" stroke-width="3"/>
  <text x="492" y="322" font-size="12.5" font-weight="800" fill="#0F766E">경로 B · VS Build Tools + Windows SDK</text>
  <text x="492" y="342" font-size="10" fill="#666666">C:\Program Files (x86)\Windows Kits\10</text>
  <rect x="492" y="352" width="346" height="28" rx="6" fill="#F3E8FF"/>
  <text x="665" y="371" font-size="10" fill="#6B21A8" text-anchor="middle">툴체인: cl.exe · link.exe · MSBuild (GUI 없음)</text>
  <rect x="492" y="386" width="346" height="28" rx="6" fill="#FEF3E2"/>
  <text x="665" y="405" font-size="10" fill="#AF5109" text-anchor="middle">SDK: 헤더(include) + 임포트 라이브러리(lib)</text>
  <text x="492" y="432" font-size="10" font-weight="700" fill="#0F766E">"Microsoft Visual C++ 14.0 or greater is required"의 처방</text>

  <rect x="470" y="462" width="390" height="96" rx="12" fill="#E8EEF7" stroke="#1A5CB5" stroke-width="2"/>
  <text x="492" y="488" font-size="12" font-weight="800" fill="#002C5F">대응 유틸리티 — vcvars · Developer Command Prompt</text>
  <text x="492" y="510" font-size="10" fill="#555555">윈도우는 포인터 대신 "환경 변수를 세팅한 터미널"을 연다.</text>
  <text x="492" y="528" font-size="10" fill="#555555">개발자 명령 프롬프트가 곧 "이 툴체인을 바라보라"는 선언</text>
  <text x="492" y="548" font-size="9.5" fill="#1A5CB5" font-weight="700">git은 별도 설치(Git for Windows) — 맥과 다른 점</text>

  <!-- 하단 대응표 -->
  <rect x="40" y="576" width="820" height="110" rx="12" fill="#0D1B2E"/>
  <text x="450" y="600" font-size="12" font-weight="800" fill="#FFF" text-anchor="middle">한 줄 대응</text>
  <text x="450" y="622" font-size="10.5" fill="#AAB9CF" text-anchor="middle">Xcode ↔ Visual Studio · CLT ↔ VS Build Tools + Windows SDK · MacOSX.sdk ↔ Windows Kits\10</text>
  <text x="450" y="642" font-size="10.5" fill="#AAB9CF" text-anchor="middle">clang ↔ cl.exe · ld ↔ link.exe · make ↔ nmake/MSBuild · .tbd 스텁 ↔ .lib 임포트 · .dylib ↔ .dll</text>
  <text x="450" y="662" font-size="10.5" fill="#AAB9CF" text-anchor="middle">xcode-select -p ↔ where cl (개발자 프롬프트에서) · Homebrew ↔ winget/choco</text>
  <text x="450" y="680" font-size="9.5" fill="#7FD1A8" text-anchor="middle">차이 하나: 맥은 git이 CLT에 동봉되고, 윈도우는 따로 받는다</text>
</svg>
