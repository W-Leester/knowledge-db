<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="tfh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#003F8A"/>
    </marker>
  </defs>
  <rect width="900" height="700" fill="#FAF7F2"/>
  <text x="450" y="34" font-size="20" font-weight="800" fill="#002C5F" text-anchor="middle">트랜스포머 이전 — 각 세대는 앞 세대의 병목에서 태어났다</text>
  <text x="450" y="58" font-size="13" fill="#666666" text-anchor="middle">관통하는 문제: "긴 문장에서 멀리 떨어진 단어들의 관계를 어떻게 기억하나"</text>

  <!-- 타임라인 축 -->
  <line x1="60" y1="90" x2="60" y2="640" stroke="#D5CFBF" stroke-width="3"/>

  <!-- 1. 규칙·통계 -->
  <circle cx="60" cy="120" r="7" fill="#8A8478"/>
  <text x="80" y="112" font-size="11" font-weight="800" fill="#666666">~2000년대</text>
  <rect x="80" y="120" width="790" height="64" rx="12" fill="#F2EDE4" stroke="#8A8478" stroke-width="2"/>
  <text x="100" y="146" font-size="13" font-weight="800" fill="#555555">규칙 기반 → 통계 기반 (n-gram)</text>
  <text x="100" y="168" font-size="10.5" fill="#555555">"바로 앞 몇 단어만 보고 다음 단어 확률을 센다" — 문맥이 사실상 2~4단어. 긴 의존은 원리적으로 불가능</text>

  <!-- 2. RNN -->
  <circle cx="60" cy="220" r="7" fill="#1A5CB5"/>
  <text x="80" y="212" font-size="11" font-weight="800" fill="#1A5CB5">~2014</text>
  <rect x="80" y="220" width="790" height="102" rx="12" fill="#E8EEF7" stroke="#1A5CB5" stroke-width="2.5"/>
  <text x="100" y="246" font-size="13" font-weight="800" fill="#002C5F">RNN (순환 신경망) — "한 단어씩 읽으며 기억을 이어간다"</text>
  <text x="100" y="268" font-size="10.5" fill="#555555">사람이 읽듯 왼쪽부터 차례로 처리하고, "지금까지의 요약"을 다음 단계로 넘긴다</text>
  <text x="100" y="290" font-size="10.5" fill="#B91C1C" font-weight="700">병목 ①: 전화 게임 — 요약을 계속 덮어쓰므로 문장이 길어지면 앞 내용이 소실 (기울기 소실)</text>
  <text x="100" y="310" font-size="10.5" fill="#B91C1C" font-weight="700">병목 ②: 순차 처리 — 10번째 단어는 9번째가 끝나야 처리 가능 → GPU의 수천 코어가 논다</text>

  <!-- 3. LSTM -->
  <circle cx="60" cy="358" r="7" fill="#0F766E"/>
  <text x="80" y="350" font-size="11" font-weight="800" fill="#0F766E">1997 고안 · 2014~ 전성기</text>
  <rect x="80" y="358" width="790" height="84" rx="12" fill="#E6F7F1" stroke="#0F766E" stroke-width="2.5"/>
  <text x="100" y="384" font-size="13" font-weight="800" fill="#0F766E">LSTM · GRU — "게이트 달린 기억"</text>
  <text x="100" y="406" font-size="10.5" fill="#555555">무엇을 기억하고 무엇을 잊을지 게이트로 조절 — 전화 게임 문제를 크게 완화. 번역·음성인식의 주역이 됨</text>
  <text x="100" y="428" font-size="10.5" fill="#B91C1C" font-weight="700">그러나 병목 ②(순차 처리)는 그대로 — 여전히 한 단어씩, 여전히 GPU가 논다</text>

  <!-- 4. seq2seq + attention -->
  <circle cx="60" cy="478" r="7" fill="#B45309"/>
  <text x="80" y="470" font-size="11" font-weight="800" fill="#AF5109">2014~2015</text>
  <rect x="80" y="478" width="790" height="84" rx="12" fill="#FEF3E2" stroke="#E8962A" stroke-width="2.5"/>
  <text x="100" y="504" font-size="13" font-weight="800" fill="#AF5109">Seq2seq + Attention — "조수"의 등장</text>
  <text x="100" y="526" font-size="10.5" fill="#555555">번역 모델(LSTM)에 보조 장치를 붙임: 출력 단어를 만들 때마다 <tspan font-weight="700">입력 문장 전체를 다시 훑어보고</tspan> 관련 부분에 집중</text>
  <text x="100" y="548" font-size="10.5" fill="#0F766E" font-weight="700">→ 번역 품질 급상승. 그런데 이상한 점이 발견된다: 성능의 대부분이 "조수(attention)"에게서 나오고 있었다</text>

  <!-- 5. Transformer -->
  <circle cx="60" cy="598" r="9" fill="#B91C1C"/>
  <text x="80" y="590" font-size="11" font-weight="800" fill="#B91C1C">2017</text>
  <rect x="80" y="598" width="790" height="76" rx="12" fill="#FEE2E2" stroke="#CD2121" stroke-width="3"/>
  <text x="100" y="624" font-size="13.5" font-weight="800" fill="#B91C1C">Transformer — "Attention Is All You Need"</text>
  <text x="100" y="646" font-size="10.5" fill="#555555">구글 연구진의 과감한 제안: <tspan font-weight="800">주인(RNN)을 해고하고 조수(attention)만 남기자.</tspan> 순차 처리가 사라지고</text>
  <text x="100" y="664" font-size="10.5" fill="#555555">모든 단어가 <tspan font-weight="700">동시에</tspan> 서로를 본다 — 병목 ①(장거리)과 ②(순차)가 한 방에 풀렸다. 논문 제목이 곧 선언문</text>
</svg>
