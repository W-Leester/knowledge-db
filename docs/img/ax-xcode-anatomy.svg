<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="axa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#003F8A"/>
    </marker>
  </defs>
  <rect width="900" height="640" fill="#FAF7F2"/>
  <text x="450" y="34" font-size="20" font-weight="800" fill="#002C5F" text-anchor="middle">Xcode 해부 — "풀옵션 공장"의 내부를 층 번호로 읽기</text>
  <text x="450" y="58" font-size="13" fill="#666666" text-anchor="middle">Xcode는 층이 아니라 작업대(IDE) — 그 안에 여러 층이 분리 불가로 동봉돼 있어 한 덩어리처럼 보인다</text>

  <!-- Xcode 공장 -->
  <rect x="30" y="84" width="530" height="430" rx="16" fill="#FFFFFF" stroke="#B91C1C" stroke-width="3"/>
  <text x="295" y="114" font-size="15" font-weight="800" fill="#B91C1C" text-anchor="middle">🍎 Xcode — 풀옵션 공장 (분리 불가 통합)</text>

  <rect x="52" y="130" width="486" height="52" rx="10" fill="#F2EDE4" stroke="#8A8478" stroke-width="1.5"/>
  <text x="70" y="152" font-size="12" font-weight="800" fill="#555555">에디터 · 프로젝트 관리 · 디버거</text>
  <text x="70" y="171" font-size="10" fill="#666666">층 아님 — 작업대 본체 (VS Code와 같은 역할)</text>
  <rect x="452" y="140" width="72" height="30" rx="15" fill="#8A8478"/>
  <text x="488" y="160" font-size="10.5" font-weight="800" fill="#FFF" text-anchor="middle">작업대</text>

  <rect x="52" y="192" width="486" height="52" rx="10" fill="#E8EEF7" stroke="#3568B0" stroke-width="1.5"/>
  <text x="70" y="214" font-size="12" font-weight="800" fill="#3568B0">swiftc · xcodebuild — 컴파일러·빌드 지휘</text>
  <text x="70" y="233" font-size="10" fill="#666666">진짜 "의무"의 몸통 ① — GUI 없이 터미널로도 부를 수 있다</text>
  <rect x="452" y="202" width="72" height="30" rx="15" fill="#3568B0"/>
  <text x="488" y="222" font-size="10.5" font-weight="800" fill="#FFF" text-anchor="middle">6층</text>

  <rect x="52" y="254" width="486" height="52" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="70" y="276" font-size="12" font-weight="800" fill="#DC2626">SDK — SwiftUI · UIKit · AppKit 프레임워크</text>
  <text x="70" y="295" font-size="10" fill="#666666">진짜 "의무"의 몸통 ② — npm처럼 창고에서 받는 게 아니라 동봉</text>
  <rect x="452" y="264" width="72" height="30" rx="15" fill="#DC2626"/>
  <text x="488" y="284" font-size="10.5" font-weight="800" fill="#FFF" text-anchor="middle">5층</text>

  <rect x="52" y="316" width="486" height="52" rx="10" fill="#E6F7F1" stroke="#00AA6C" stroke-width="1.5"/>
  <text x="70" y="338" font-size="12" font-weight="800" fill="#065F46">SwiftPM — 패키지 매니저</text>
  <text x="70" y="357" font-size="10" fill="#666666">이건 표준적 — 깃 저장소에서 패키지를 받아온다</text>
  <rect x="452" y="326" width="72" height="30" rx="15" fill="#065F46"/>
  <text x="488" y="346" font-size="10.5" font-weight="800" fill="#FFF" text-anchor="middle">3층</text>

  <rect x="52" y="378" width="486" height="52" rx="10" fill="#FEF3E2" stroke="#E8962A" stroke-width="1.5"/>
  <text x="70" y="400" font-size="12" font-weight="800" fill="#B45309">iOS 시뮬레이터</text>
  <text x="70" y="419" font-size="10" fill="#666666">iOS라는 실행환경의 복제품 — 맥의 가상화 기술에 묶임</text>
  <rect x="452" y="388" width="72" height="30" rx="15" fill="#B45309"/>
  <text x="488" y="408" font-size="10.5" font-weight="800" fill="#FFF" text-anchor="middle">2층 유사</text>

  <rect x="52" y="440" width="486" height="52" rx="10" fill="#F3E8FF" stroke="#6B21A8" stroke-width="1.5"/>
  <text x="70" y="462" font-size="12" font-weight="800" fill="#6B21A8">코드 서명 · 공증 · App Store 업로드</text>
  <text x="70" y="481" font-size="10" fill="#666666">애플 유통망의 관문 도구 — 배포할 때만 발동 (§4)</text>
  <rect x="452" y="450" width="72" height="30" rx="15" fill="#6B21A8"/>
  <text x="488" y="470" font-size="10.5" font-weight="800" fill="#FFF" text-anchor="middle">관문</text>

  <!-- VS Code 대비 -->
  <rect x="590" y="84" width="280" height="430" rx="16" fill="#FFFFFF" stroke="#1A5CB5" stroke-width="2"/>
  <text x="730" y="114" font-size="15" font-weight="800" fill="#1A5CB5" text-anchor="middle">🧰 VS Code — 빈 작업대</text>
  <rect x="612" y="130" width="236" height="52" rx="10" fill="#F2EDE4" stroke="#8A8478" stroke-width="1.5"/>
  <text x="730" y="152" font-size="12" font-weight="800" fill="#555555" text-anchor="middle">에디터 · 확장 시스템</text>
  <text x="730" y="171" font-size="10" fill="#666666" text-anchor="middle">작업대 본체만 있다</text>

  <rect x="612" y="196" width="236" height="130" rx="10" fill="#E8EEF7" stroke="#1A5CB5" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="730" y="220" font-size="11.5" font-weight="800" fill="#1A5CB5" text-anchor="middle">빈 슬롯 — 시장에서 조달</text>
  <text x="730" y="244" font-size="10.5" fill="#555555" text-anchor="middle">런타임: Node? Python? 내가 설치</text>
  <text x="730" y="266" font-size="10.5" fill="#555555" text-anchor="middle">빌드: Vite? tsc? 내가 선택</text>
  <text x="730" y="288" font-size="10.5" fill="#555555" text-anchor="middle">패키지: npm? uv? 내가 조합</text>
  <text x="730" y="312" font-size="9.5" fill="#666666" text-anchor="middle">자유롭지만 조립은 내 몫</text>

  <text x="730" y="358" font-size="11" font-weight="800" fill="#065F46" text-anchor="middle">얻는 것: 자유 · 어느 생태계든</text>
  <text x="730" y="380" font-size="11" font-weight="800" fill="#DC2626" text-anchor="middle">Xcode가 얻는 것: 설정 지옥 제로</text>
  <text x="730" y="402" font-size="11" font-weight="800" fill="#DC2626" text-anchor="middle">Xcode가 치르는 것: 선택지 없음</text>
  <text x="730" y="424" font-size="10" fill="#666666" text-anchor="middle">+ 맥에 묶임 (세 겹의 벽 —</text>
  <text x="730" y="440" font-size="10" fill="#666666" text-anchor="middle">「로컬 LLM 코딩 공장」 §3)</text>
  <text x="730" y="478" font-size="10.5" font-weight="700" fill="#1A5CB5" text-anchor="middle">§6 "층의 재통합"의 극단 사례 —</text>
  <text x="730" y="496" font-size="10.5" font-weight="700" fill="#1A5CB5" text-anchor="middle">IDE까지 포함한 수직 통합</text>

  <!-- 하단 -->
  <rect x="30" y="534" width="840" height="88" rx="12" fill="#0D1B2E"/>
  <text x="450" y="562" font-size="13" font-weight="800" fill="#FFF" text-anchor="middle">핵심: "Xcode를 통해서만 빌드된다"에서 의무인 건 껍데기(작업대)가 아니라 알맹이(6층+5층+관문)다</text>
  <text x="450" y="586" font-size="11.5" fill="#AAB9CF" text-anchor="middle">증거 — CI 서버·자동화 러너는 GUI Xcode를 한 번도 안 열고 터미널의 xcodebuild로 빌드한다</text>
  <text x="450" y="608" font-size="11.5" fill="#AAB9CF" text-anchor="middle">그리고 알맹이의 경량판이 따로 있다: Command Line Tools — swiftc·SDK만 담은 무료 축소판 (§5의 열쇠)</text>
</svg>
