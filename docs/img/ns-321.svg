<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="n3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#003F8A"/>
    </marker>
  </defs>
  <rect width="900" height="580" fill="#FAF7F2"/>
  <text x="450" y="34" font-size="20" font-weight="800" fill="#002C5F" text-anchor="middle">3-2-1 — 백업의 정석과 구글드라이브의 새 역할</text>
  <text x="450" y="58" font-size="13" fill="#666666" text-anchor="middle">사본 3개 · 다른 매체 2종 · 집 밖(오프사이트) 1개 — NAS는 이 중 "2"까지만 해결한다</text>

  <!-- 1차 -->
  <rect x="30" y="84" width="840" height="120" rx="14" fill="#E8EEF7" stroke="#1A5CB5" stroke-width="2"/>
  <text x="52" y="112" font-size="13.5" font-weight="800" fill="#002C5F">1차 사본 — 각 기기의 로컬 (작업 원본)</text>
  <rect x="52" y="126" width="250" height="58" rx="10" fill="#FFFFFF"/>
  <text x="177" y="150" font-size="11.5" font-weight="800" fill="#002C5F" text-anchor="middle">💻 윈도우 PC (9950X3D)</text>
  <text x="177" y="170" font-size="9.5" fill="#666666" text-anchor="middle">게임 · 윈도우 전용 작업</text>
  <rect x="318" y="126" width="250" height="58" rx="10" fill="#FFFFFF"/>
  <text x="443" y="150" font-size="11.5" font-weight="800" fill="#002C5F" text-anchor="middle">💻 맥북 M5 Max 128GB</text>
  <text x="443" y="170" font-size="9.5" fill="#666666" text-anchor="middle">주력 작업 · 로컬 LLM</text>
  <rect x="584" y="126" width="264" height="58" rx="10" fill="#FFFFFF"/>
  <text x="716" y="150" font-size="11.5" font-weight="800" fill="#002C5F" text-anchor="middle">🖥 맥미니 M4 16GB</text>
  <text x="716" y="170" font-size="9.5" fill="#666666" text-anchor="middle">상주 서버 후보 (AI 게이트웨이)</text>

  <line x1="450" y1="204" x2="450" y2="232" stroke="#003F8A" stroke-width="2.5" marker-end="url(#n3a)"/>
  <text x="560" y="224" font-size="10.5" fill="#666666" text-anchor="middle">Time Machine ×2 + 윈도우 이미지 백업 · 자동</text>

  <!-- 2차 -->
  <rect x="30" y="236" width="840" height="130" rx="14" fill="#E6F7F1" stroke="#0F766E" stroke-width="2.5"/>
  <text x="52" y="264" font-size="13.5" font-weight="800" fill="#0F766E">2차 사본 — NAS (집 안의 데이터 기관실 · 대용량 전부)</text>
  <rect x="52" y="278" width="796" height="72" rx="10" fill="#FFFFFF"/>
  <text x="70" y="302" font-size="11" fill="#555555">· 기기 3대의 백업 통합 (스냅샷 — 랜섬웨어·실수 삭제 되돌리기)</text>
  <text x="70" y="322" font-size="11" fill="#555555">· LLM 모델 창고(수백 GB) · 사진 라이브러리 · 폴더 동기화(개인 클라우드)</text>
  <text x="70" y="342" font-size="11" fill="#555555">· Docker 잡무 서비스 (24시간) — AI 두뇌는 맥미니, 저장·잡무는 NAS로 분담</text>

  <line x1="450" y1="366" x2="450" y2="394" stroke="#003F8A" stroke-width="2.5" marker-end="url(#n3a)"/>
  <text x="580" y="386" font-size="10.5" fill="#666666" text-anchor="middle">NAS가 자동으로 · 암호화해서 · 소량만 (야간)</text>

  <!-- 3차 -->
  <rect x="30" y="398" width="840" height="100" rx="14" fill="#FEF3E2" stroke="#E8962A" stroke-width="2.5"/>
  <text x="52" y="426" font-size="13.5" font-weight="800" fill="#B45309">3차 사본 — 클라우드 (집 밖 · 최후의 보루 · 소량)</text>
  <text x="52" y="450" font-size="11.5" fill="#555555">진짜 잃으면 안 되는 것만: 문서 · 사진 원본 · 코드 — 구글드라이브를 유지하되 <tspan font-weight="800">용량 다이어트</tspan>,</text>
  <text x="52" y="470" font-size="11.5" fill="#555555">또는 NAS 백업 앱이 B2/S3류 저가 스토리지에 암호화 업로드 — 요금은 줄고 역할은 "최후의 보루"로</text>
  <text x="52" y="488" font-size="9.5" fill="#666666">모델·미디어처럼 다시 받을 수 있는 것은 올리지 않는다 — 오프사이트는 "복구 불가능한 것" 전용</text>

  <!-- 경고 -->
  <rect x="30" y="514" width="840" height="50" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="450" y="536" font-size="12.5" font-weight="800" fill="#DC2626" text-anchor="middle">🔥 함정: NAS만 사서 구글드라이브를 끊으면 3-2-1의 "1"이 사라진다 — 화재·도난·낙뢰면 PC와 NAS가 함께 죽는다</text>
  <text x="450" y="556" font-size="11" fill="#555555" text-anchor="middle">NAS는 구글드라이브의 "대체"가 아니라 "역할 재배치" — 클라우드는 축소하되 유지하는 것이 정석</text>
</svg>
