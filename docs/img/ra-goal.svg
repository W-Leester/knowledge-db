<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="rga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#003F8A"/>
    </marker>
  </defs>
  <rect width="900" height="640" fill="#FAF7F2"/>
  <text x="450" y="34" font-size="20" font-weight="800" fill="#002C5F" text-anchor="middle">궁극의 목표 — "위임의 사다리"를 오르는 것</text>
  <text x="450" y="58" font-size="13" fill="#8A8A8A" text-anchor="middle">도구 → 조수 → 비서 → 참모 — 상주형은 지금 3단에 있고, 4단을 향해 만들어지고 있다</text>

  <!-- 사다리 계단 (좌하 → 우상) -->
  <rect x="40" y="440" width="190" height="90" rx="12" fill="#E8EEF7" stroke="#1A5CB5" stroke-width="2"/>
  <text x="135" y="468" font-size="13" font-weight="800" fill="#002C5F" text-anchor="middle">1단 · 도구</text>
  <text x="135" y="490" font-size="10.5" fill="#555555" text-anchor="middle">검색엔진·앱 — 조작은</text>
  <text x="135" y="506" font-size="10.5" fill="#555555" text-anchor="middle">전부 내가, 판단도 내가</text>
  <text x="135" y="522" font-size="9.5" fill="#8A8A8A" text-anchor="middle">~2022</text>

  <rect x="250" y="350" width="190" height="90" rx="12" fill="#E6F7F1" stroke="#00AA6C" stroke-width="2"/>
  <text x="345" y="378" font-size="13" font-weight="800" fill="#065F46" text-anchor="middle">2단 · 조수</text>
  <text x="345" y="400" font-size="10.5" fill="#555555" text-anchor="middle">챗봇 — 물으면 답하고</text>
  <text x="345" y="416" font-size="10.5" fill="#555555" text-anchor="middle">시키면 한 가지를 한다</text>
  <text x="345" y="432" font-size="9.5" fill="#8A8A8A" text-anchor="middle">2023~ · 세션이 끝나면 초기화</text>

  <rect x="460" y="260" width="190" height="90" rx="12" fill="#FEF3E2" stroke="#E8962A" stroke-width="2.5"/>
  <text x="555" y="288" font-size="13" font-weight="800" fill="#B45309" text-anchor="middle">3단 · 비서 ★ 지금 여기</text>
  <text x="555" y="310" font-size="10.5" fill="#555555" text-anchor="middle">상주형 — 맥락·기억 갖고</text>
  <text x="555" y="326" font-size="10.5" fill="#555555" text-anchor="middle">반복 업무를 알아서 처리</text>
  <text x="555" y="342" font-size="9.5" fill="#8A8A8A" text-anchor="middle">2026~ · OpenClaw·Hermes</text>

  <rect x="670" y="170" width="200" height="90" rx="12" fill="#FEE2E2" stroke="#9F1239" stroke-width="2.5"/>
  <text x="770" y="198" font-size="13" font-weight="800" fill="#9F1239" text-anchor="middle">4단 · 참모(집사)</text>
  <text x="770" y="220" font-size="10.5" fill="#555555" text-anchor="middle">목표만 주면 계획·실행·보고</text>
  <text x="770" y="236" font-size="10.5" fill="#555555" text-anchor="middle">— 디지털 삶의 단일 창구</text>
  <text x="770" y="252" font-size="9.5" fill="#8A8A8A" text-anchor="middle">지향점 · 자기 개선(§6)이 가는 길</text>

  <line x1="230" y1="470" x2="262" y2="430" stroke="#003F8A" stroke-width="2.2" marker-end="url(#rga)"/>
  <line x1="440" y1="380" x2="472" y2="340" stroke="#003F8A" stroke-width="2.2" marker-end="url(#rga)"/>
  <line x1="650" y1="290" x2="682" y2="250" stroke="#003F8A" stroke-width="2.2" marker-end="url(#rga)"/>

  <!-- 5단 지평선 -->
  <rect x="670" y="84" width="200" height="62" rx="12" fill="none" stroke="#8A8A8A" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="770" y="108" font-size="12" font-weight="800" fill="#8A8A8A" text-anchor="middle">(지평선) 5단 · 대리인</text>
  <text x="770" y="128" font-size="10" fill="#8A8A8A" text-anchor="middle">위임된 권한으로 대신 결정 —</text>
  <text x="770" y="141" font-size="10" fill="#8A8A8A" text-anchor="middle">기술보다 신뢰·제도의 문제</text>

  <!-- 왼쪽 설명: 각 단에서 얻는 것 -->
  <rect x="40" y="84" width="380" height="150" rx="14" fill="#FFFFFF" stroke="#B5AFA5" stroke-width="1.5"/>
  <text x="230" y="112" font-size="13" font-weight="800" fill="#002C5F" text-anchor="middle">계단마다 되찾는 것</text>
  <text x="60" y="140" font-size="11.5" fill="#555555">2단 → <tspan font-weight="700">시간</tspan> (검색·작성이 빨라진다)</text>
  <text x="60" y="166" font-size="11.5" fill="#555555">3단 → <tspan font-weight="700">주의력</tspan> (지켜보고 챙기는 일이 사라진다)</text>
  <text x="60" y="192" font-size="11.5" fill="#555555">4단 → <tspan font-weight="700">관리 부담</tspan> (여러 앱·계정의 운영 자체를 위임)</text>
  <text x="60" y="218" font-size="10.5" fill="#8A8A8A">궁극적으로 자동화되는 건 "일"이 아니라 "신경 쓰는 것"</text>

  <!-- 인터페이스 역전 -->
  <rect x="40" y="556" width="830" height="0" fill="none"/>
  <rect x="30" y="548" width="410" height="76" rx="12" fill="#E8EEF7" stroke="#1A5CB5" stroke-width="1.8"/>
  <text x="235" y="572" font-size="12" font-weight="800" fill="#002C5F" text-anchor="middle">지금: 내가 인터페이스를 오간다</text>
  <text x="235" y="594" font-size="10.5" fill="#555555" text-anchor="middle">나 → 메일 앱 → 캘린더 → 뱅킹 → 쇼핑 → SNS …</text>
  <text x="235" y="612" font-size="10" fill="#8A8A8A" text-anchor="middle">앱 10개의 UI를 내 손가락이 순회</text>

  <rect x="460" y="548" width="410" height="76" rx="12" fill="#FEE2E2" stroke="#9F1239" stroke-width="1.8"/>
  <text x="665" y="572" font-size="12" font-weight="800" fill="#9F1239" text-anchor="middle">지향: 에이전트가 인터페이스가 된다</text>
  <text x="665" y="594" font-size="10.5" fill="#555555" text-anchor="middle">나 → 대화 하나 → (에이전트가 앱들을 대신 조작)</text>
  <text x="665" y="612" font-size="10" fill="#8A8A8A" text-anchor="middle">앱은 사람용 화면에서 에이전트용 백엔드로</text>
</svg>
