<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="kmq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#003F8A"/>
    </marker>
    <marker id="kmg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00AA6C"/>
    </marker>
  </defs>
  <rect width="900" height="760" fill="#FAF7F2"/>
  <text x="450" y="34" font-size="20" font-weight="800" fill="#002C5F" text-anchor="middle">질의 단계 — 질문의 모양에 따라 걷는 길이 다르다</text>
  <text x="450" y="58" font-size="13" fill="#666666" text-anchor="middle">공통점: 임베딩 모델은 질문마다 1회, 생성 LLM은 맨 끝에 1회 — 가운데는 전부 색인이 일한다</text>

  <!-- 질문 A: 시맨틱 -->
  <rect x="30" y="80" width="840" height="180" rx="14" fill="#E8EEF7" stroke="#1A5CB5" stroke-width="2.5"/>
  <text x="52" y="108" font-size="13.5" font-weight="800" fill="#002C5F">질문 A — "휴가 이월 규정이 언급된 메일 찾아줘" (시맨틱형: 벡터로 충분)</text>

  <rect x="52" y="126" width="150" height="60" rx="10" fill="#FFFFFF" stroke="#1A5CB5" stroke-width="1.5"/>
  <text x="127" y="150" font-size="10.5" font-weight="800" fill="#002C5F" text-anchor="middle">임베딩 모델 ①</text>
  <text x="127" y="168" font-size="9.5" fill="#555555" text-anchor="middle">질문 → 좌표 (1회)</text>
  <line x1="202" y1="156" x2="234" y2="156" stroke="#003F8A" stroke-width="2.2" marker-end="url(#kmq)"/>

  <rect x="238" y="126" width="170" height="60" rx="10" fill="#FFFFFF" stroke="#1A5CB5" stroke-width="1.5"/>
  <text x="323" y="150" font-size="10.5" font-weight="800" fill="#002C5F" text-anchor="middle">벡터 DB (pgvector)</text>
  <text x="323" y="168" font-size="9.5" fill="#555555" text-anchor="middle">"연차 이월" 문단도 잡힘</text>
  <line x1="408" y1="156" x2="440" y2="156" stroke="#003F8A" stroke-width="2.2" marker-end="url(#kmq)"/>

  <rect x="444" y="126" width="170" height="60" rx="10" fill="#FFFFFF" stroke="#8A8478" stroke-width="1.5"/>
  <text x="529" y="150" font-size="10.5" font-weight="800" fill="#555555" text-anchor="middle">(선택) 메타 필터</text>
  <text x="529" y="168" font-size="9.5" fill="#555555" text-anchor="middle">기간·보낸이로 좁히기 (SQL)</text>
  <line x1="614" y1="156" x2="646" y2="156" stroke="#003F8A" stroke-width="2.2" marker-end="url(#kmq)"/>

  <rect x="650" y="126" width="200" height="60" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="750" y="150" font-size="10.5" font-weight="800" fill="#C82020" text-anchor="middle">생성 LLM ① (마지막 1회)</text>
  <text x="750" y="168" font-size="9.5" fill="#555555" text-anchor="middle">찾은 메일들 요약·답변 작성</text>

  <text x="52" y="216" font-size="10.5" fill="#555555">호출 집계: 임베딩 1회 + 생성 1회 — 그래프·온톨로지는 <tspan font-weight="700">등판하지 않는다</tspan> (표준 RAG로 충분한 질문)</text>
  <text x="52" y="238" font-size="10" fill="#666666">"검색만 원하면 생성 LLM마저 생략 가능 — 메일 목록만 받으면 끝" (「PostgreSQL 해부」 §3의 그 구분)</text>

  <!-- 질문 B: 멀티홉 -->
  <rect x="30" y="284" width="840" height="330" rx="14" fill="#FEF3E2" stroke="#E8962A" stroke-width="3"/>
  <text x="52" y="312" font-size="13.5" font-weight="800" fill="#AF5109">질문 B — "작년 B전자와의 단가 협상 스레드에서 최종 합의 금액은?" (멀티홉형: 그래프가 주인공)</text>

  <rect x="52" y="330" width="150" height="56" rx="10" fill="#FFFFFF" stroke="#1A5CB5" stroke-width="1.5"/>
  <text x="127" y="352" font-size="10.5" font-weight="800" fill="#002C5F" text-anchor="middle">임베딩 모델 ①</text>
  <text x="127" y="370" font-size="9.5" fill="#555555" text-anchor="middle">질문 → 좌표 (1회)</text>
  <line x1="202" y1="358" x2="234" y2="358" stroke="#003F8A" stroke-width="2.2" marker-end="url(#kmq)"/>

  <rect x="238" y="330" width="170" height="56" rx="10" fill="#FFFFFF" stroke="#1A5CB5" stroke-width="1.5"/>
  <text x="323" y="352" font-size="10.5" font-weight="800" fill="#002C5F" text-anchor="middle">벡터 = 진입점만</text>
  <text x="323" y="370" font-size="9.5" fill="#555555" text-anchor="middle">"B전자·단가" 근처 노드 발견</text>
  <line x1="408" y1="358" x2="440" y2="358" stroke="#00AA6C" stroke-width="2.5" marker-end="url(#kmg)"/>

  <rect x="444" y="322" width="406" height="180" rx="12" fill="#E6F7F1" stroke="#0F766E" stroke-width="2.5"/>
  <text x="647" y="346" font-size="11.5" font-weight="800" fill="#0F766E" text-anchor="middle">그래프 걷기 — 공짜 그래프(헤더)가 여기서 일한다</text>
  <circle cx="500" cy="392" r="26" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="500" y="388" font-size="9" font-weight="800" fill="#D52222" text-anchor="middle">:조직</text>
  <text x="500" y="401" font-size="8.5" fill="#555555" text-anchor="middle">B전자</text>
  <circle cx="590" cy="440" r="26" fill="#E8EEF7" stroke="#1A5CB5" stroke-width="2"/>
  <text x="590" y="436" font-size="9" font-weight="800" fill="#002C5F" text-anchor="middle">:사람</text>
  <text x="590" y="449" font-size="8.5" fill="#555555" text-anchor="middle">김부장</text>
  <circle cx="690" cy="392" r="26" fill="#F3E8FF" stroke="#6B21A8" stroke-width="2"/>
  <text x="690" y="388" font-size="9" font-weight="800" fill="#6B21A8" text-anchor="middle">:스레드</text>
  <text x="690" y="401" font-size="8.5" fill="#555555" text-anchor="middle">단가 협상</text>
  <circle cx="790" cy="440" r="26" fill="#FEF3E2" stroke="#E8962A" stroke-width="2"/>
  <text x="790" y="436" font-size="9" font-weight="800" fill="#AF5109" text-anchor="middle">:메일</text>
  <text x="790" y="449" font-size="8.5" fill="#555555" text-anchor="middle">최신 회신</text>
  <line x1="522" y1="406" x2="566" y2="428" stroke="#0F766E" stroke-width="2" marker-end="url(#kmg)"/>
  <line x1="612" y1="426" x2="666" y2="404" stroke="#0F766E" stroke-width="2" marker-end="url(#kmg)"/>
  <line x1="712" y1="406" x2="766" y2="428" stroke="#0F766E" stroke-width="2" marker-end="url(#kmg)"/>
  <text x="544" y="426" font-size="8.5" font-weight="700" fill="#0F766E" text-anchor="middle">소속</text>
  <text x="639" y="404" font-size="8.5" font-weight="700" fill="#0F766E" text-anchor="middle">참여</text>
  <text x="739" y="426" font-size="8.5" font-weight="700" fill="#0F766E" text-anchor="middle">시간순 끝</text>
  <text x="647" y="482" font-size="9.5" fill="#555555" text-anchor="middle">조직→사람→스레드→마지막 회신까지 3홉 — "최종"은 시간 정렬로 확정</text>

  <rect x="52" y="398" width="150 " height="88" rx="10" fill="#F3E8FF" stroke="#6B21A8" stroke-width="2"/>
  <text x="127" y="422" font-size="10.5" font-weight="800" fill="#6B21A8" text-anchor="middle">온톨로지 필터</text>
  <text x="127" y="442" font-size="9" fill="#555555" text-anchor="middle">"협상 참여자는 사람"</text>
  <text x="127" y="458" font-size="9" fill="#555555" text-anchor="middle">"회신은 원본보다 늦다"</text>
  <text x="127" y="476" font-size="8.5" fill="#666666" text-anchor="middle">엉뚱한 경로 차단</text>
  <line x1="202" y1="440" x2="440" y2="440" stroke="#6B21A8" stroke-width="1.8" stroke-dasharray="5 4"/>

  <rect x="52" y="520" width="560" height="76" rx="10" fill="#FFFFFF" stroke="#B5AFA5" stroke-width="1.5"/>
  <text x="72" y="544" font-size="10.5" font-weight="800" fill="#002C5F">근거 조립 — 걸어온 경로의 메일 원문(해당 스레드 회신들)을 시간순으로 컨텍스트에</text>
  <text x="72" y="564" font-size="10" fill="#555555">벡터가 찾은 문단이 아니라 <tspan font-weight="700">그래프가 확정한 스레드</tspan>가 근거가 된다 — 출처가 경로로 증명됨</text>
  <text x="72" y="584" font-size="9.5" fill="#666666">SQL 한 번으로 원문 JOIN (같은 Postgres 안이므로)</text>

  <rect x="630" y="520" width="220" height="76" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="740" y="546" font-size="10.5" font-weight="800" fill="#C82020" text-anchor="middle">생성 LLM ① (마지막 1회)</text>
  <text x="740" y="566" font-size="9.5" fill="#555555" text-anchor="middle">"최종 합의 금액은 ○○원입니다</text>
  <text x="740" y="582" font-size="9.5" fill="#555555" text-anchor="middle">(12/18 김부장 회신 기준)"</text>
  <line x1="612" y1="558" x2="626" y2="558" stroke="#003F8A" stroke-width="2.2" marker-end="url(#kmq)"/>

  <!-- 집계 표 -->
  <rect x="30" y="634" width="840" height="76" rx="12" fill="#FFFFFF" stroke="#B5AFA5" stroke-width="1.5"/>
  <text x="450" y="658" font-size="12" font-weight="800" fill="#002C5F" text-anchor="middle">호출 집계 비교 — 모델은 양 끝에만, 가운데는 색인이 일한다</text>
  <text x="240" y="682" font-size="10.5" fill="#555555" text-anchor="middle">질문 A: 임베딩 1 · 벡터 1 · <tspan fill="#8A8478">그래프 0 · 온톨로지 0</tspan> · LLM 1</text>
  <text x="660" y="682" font-size="10.5" fill="#555555" text-anchor="middle">질문 B: 임베딩 1 · 벡터 1 · <tspan font-weight="700" fill="#0F766E">그래프 3홉 · 온톨로지 상시</tspan> · LLM 1</text>
  <text x="450" y="700" font-size="10" fill="#666666" text-anchor="middle">어느 쪽이든 생성 LLM은 정확히 1회 — 비용·환각 표면적이 최소화되는 구조</text>

  <rect x="30" y="722" width="840" height="28" rx="8" fill="#0D1B2E"/>
  <text x="450" y="741" font-size="11" font-weight="800" fill="#FFF" text-anchor="middle">설계 요령: 질문 A형이 대부분이면 벡터만으로 시작하고, B형이 실제로 나올 때 그래프를 켠다 — §7의 그 원칙</text>
</svg>
