<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="ftl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#003F8A"/>
    </marker>
    <marker id="ftr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
    <marker id="ftg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00AA6C"/>
    </marker>
  </defs>
  <rect width="900" height="720" fill="#FAF7F2"/>
  <text x="450" y="34" font-size="20" font-weight="800" fill="#002C5F" text-anchor="middle">3레벨 감시 개념 — 엔진 제어의 표준 안전 아키텍처</text>
  <text x="450" y="58" font-size="13" fill="#666666" text-anchor="middle">핵심은 <tspan font-weight="700">독립성</tspan>이다 — 감시자는 감시 대상과 다른 로직·다른 하드웨어에 있어야 한다</text>

  <!-- 입력 -->
  <rect x="30" y="82" width="150" height="60" rx="10" fill="#FFFFFF" stroke="#8A8478" stroke-width="1.8"/>
  <text x="105" y="106" font-size="11.5" font-weight="800" fill="#002C5F" text-anchor="middle">운전자 입력</text>
  <text x="105" y="126" font-size="10" fill="#666666" text-anchor="middle">가속 페달 · 센서</text>

  <line x1="180" y1="112" x2="216" y2="112" stroke="#003F8A" stroke-width="2.2" marker-end="url(#ftl)"/>

  <!-- Level 1 -->
  <rect x="220" y="82" width="440" height="128" rx="14" fill="#E8EEF7" stroke="#1A5CB5" stroke-width="2.5"/>
  <text x="240" y="110" font-size="15" font-weight="800" fill="#002C5F">Level 1 · 기능 레벨 (Function Level)</text>
  <text x="240" y="134" font-size="11" fill="#555555">실제 엔진 제어를 하는 본체 — 요청 토크 계산 · 연료 분사량 ·</text>
  <text x="240" y="152" font-size="11" fill="#555555">점화 시기 · 스로틀 각도 · 부스트 제어</text>
  <text x="240" y="176" font-size="10.5" fill="#666666">복잡한 맵·보정·학습이 전부 여기 — 코드의 대부분을 차지한다</text>
  <text x="240" y="196" font-size="10.5" font-weight="700" fill="#1A5CB5">특징: 성능·연비·배기를 담당하지만, 스스로를 검증하지 않는다</text>

  <line x1="660" y1="146" x2="700" y2="146" stroke="#003F8A" stroke-width="2.2" marker-end="url(#ftl)"/>
  <rect x="704" y="118" width="166" height="56" rx="10" fill="#F2EDE4" stroke="#8A8478" stroke-width="1.8"/>
  <text x="787" y="142" font-size="11.5" font-weight="800" fill="#555555" text-anchor="middle">액추에이터</text>
  <text x="787" y="162" font-size="10" fill="#666666" text-anchor="middle">인젝터 · 스로틀 · 코일</text>

  <!-- Level 2 -->
  <rect x="220" y="230" width="440" height="150" rx="14" fill="#FEF3E2" stroke="#E8962A" stroke-width="3"/>
  <text x="240" y="258" font-size="15" font-weight="800" fill="#B45309">Level 2 · 기능 감시 레벨 (Function Monitoring)</text>
  <text x="240" y="282" font-size="11" fill="#555555">Level 1의 <tspan font-weight="700">결과를 독립적으로 재계산해 검증</tspan>한다 —</text>
  <text x="240" y="302" font-size="11.5" font-weight="800" fill="#002C5F">"운전자가 요청한 토크" vs "실제 발생할 토크"를 비교</text>
  <text x="240" y="324" font-size="11" fill="#555555">허용 범위를 벗어나면 → 안전 상태로 전환 명령</text>
  <text x="240" y="348" font-size="10.5" font-weight="700" fill="#B45309">독립성 요구: Level 1과 다른 알고리즘·다른 변수로 계산해야 한다</text>
  <text x="240" y="366" font-size="10" fill="#666666">(같은 코드를 두 번 돌리면 같은 버그에 똑같이 당한다 → 감시 의미 없음)</text>

  <!-- L1 → L2 검증 화살표 -->
  <path d="M 300 210 L 300 226" fill="none" stroke="#E8962A" stroke-width="2.5" marker-end="url(#ftl)"/>
  <text x="318" y="224" font-size="10" font-weight="700" fill="#B45309">계산 결과 전달</text>
  <path d="M 600 226 L 600 214" fill="none" stroke="#DC2626" stroke-width="2.5" marker-end="url(#ftr)"/>
  <text x="616" y="224" font-size="10" font-weight="700" fill="#DC2626">불일치 시 차단</text>

  <!-- Level 3 -->
  <rect x="220" y="400" width="440" height="176" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/>
  <text x="240" y="428" font-size="15" font-weight="800" fill="#DC2626">Level 3 · 컨트롤러 감시 레벨 (Controller Monitoring)</text>
  <text x="240" y="452" font-size="11" fill="#555555">"계산이 맞나"가 아니라 <tspan font-weight="700">"이 CPU가 애초에 정상인가"</tspan>를 감시한다</text>
  <rect x="240" y="466" width="196" height="94" rx="9" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <text x="338" y="488" font-size="11" font-weight="800" fill="#991B1B" text-anchor="middle">감시 수단</text>
  <text x="254" y="508" font-size="10" fill="#555555">· Q&amp;A 워치독 (외부 IC)</text>
  <text x="254" y="526" font-size="10" fill="#555555">· ALU·레지스터 자기 테스트</text>
  <text x="254" y="544" font-size="10" fill="#555555">· 프로그램 흐름 감시 · 메모리 검사</text>
  <rect x="448" y="466" width="196" height="94" rx="9" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <text x="546" y="488" font-size="11" font-weight="800" fill="#991B1B" text-anchor="middle">잡아내는 고장</text>
  <text x="462" y="508" font-size="10" fill="#555555">· 클럭 이상 · 전원 이상</text>
  <text x="462" y="526" font-size="10" fill="#555555">· 비트 플립 (EMI·우주선)</text>
  <text x="462" y="544" font-size="10" fill="#555555">· 스택 오버플로 · 무한 루프</text>

  <!-- 외부 IC -->
  <rect x="690" y="400" width="180" height="176" rx="14" fill="#0D1B2E"/>
  <text x="780" y="428" font-size="12.5" font-weight="800" fill="#FFF" text-anchor="middle">🔌 외부 감시 IC</text>
  <text x="780" y="448" font-size="10" fill="#AAB9CF" text-anchor="middle">(SBC에 통합되는 경우가 많음)</text>
  <text x="704" y="474" font-size="10" fill="#AAB9CF">· 전원 관리</text>
  <text x="704" y="492" font-size="10" fill="#AAB9CF">· CAN 트랜시버</text>
  <text x="704" y="510" font-size="10" fill="#AAB9CF">· Q&amp;A 워치독</text>
  <text x="704" y="528" font-size="10" fill="#AAB9CF">· 파워스테이지 차단 경로</text>
  <text x="780" y="554" font-size="10.5" font-weight="800" fill="#7FD1A8" text-anchor="middle">MCU 밖에 있어야</text>
  <text x="780" y="570" font-size="10.5" font-weight="800" fill="#7FD1A8" text-anchor="middle">MCU가 죽어도 산다</text>

  <line x1="686" y1="488" x2="664" y2="488" stroke="#DC2626" stroke-width="2.5" marker-end="url(#ftr)"/>

  <!-- MCU 감시 대상 표시 -->
  <path d="M 220 466 L 190 466 L 190 146 L 216 146" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="176" y="310" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle" transform="rotate(-90 176 310)">CPU 전체를 감시</text>

  <!-- 안전 상태 -->
  <rect x="30" y="600" width="400" height="96" rx="12" fill="#E6F7F1" stroke="#0F766E" stroke-width="2.5"/>
  <text x="52" y="626" font-size="13" font-weight="800" fill="#0F766E">🛑 안전 상태 (Safe State) — 감시가 실패를 선언하면</text>
  <text x="52" y="650" font-size="10.5" fill="#555555">· 연료 분사 차단 · 파워스테이지(액추에이터 전원) 차단</text>
  <text x="52" y="668" font-size="10.5" fill="#555555">· 리셋 후 재시작 · 림프홈(제한 출력으로 주행 가능)</text>
  <text x="52" y="688" font-size="10" font-weight="700" fill="#0F766E">"멈추는 것"이 아니라 "예측 가능하게 무해해지는 것"이 목표</text>

  <path d="M 440 540 C 470 620 460 640 434 648" fill="none" stroke="#00AA6C" stroke-width="2.5" marker-end="url(#ftg)"/>

  <rect x="450" y="600" width="420" height="96" rx="12" fill="#E8EEF7" stroke="#1A5CB5" stroke-width="2"/>
  <text x="472" y="626" font-size="13" font-weight="800" fill="#002C5F">⏱ 타임아웃은 FTTI에서 나온다</text>
  <text x="472" y="650" font-size="10.5" fill="#555555">FTTI(고장 허용 시간) = "고장이 위험으로 번지기까지의 시간"</text>
  <text x="472" y="668" font-size="10.5" fill="#555555">→ 감지 + 안전 상태 진입이 <tspan font-weight="700">그 시간 안에</tspan> 끝나야 한다</text>
  <text x="472" y="688" font-size="10" fill="#666666">그래서 워치독 주기·태스크 주기가 임의값이 아니라 <tspan font-weight="700">역산된 값</tspan>이다</text>
</svg>
