<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="ccs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#003F8A"/>
    </marker>
  </defs>
  <rect width="900" height="660" fill="#FAF7F2"/>
  <text x="450" y="34" font-size="20" font-weight="800" fill="#002C5F" text-anchor="middle">배포 전략 4종 — "어떻게 갈아 끼우나"</text>
  <text x="450" y="58" font-size="13" fill="#666666" text-anchor="middle">공통 목표는 하나 — 잘못됐을 때 <tspan font-weight="700">빨리 되돌리는 것</tspan></text>

  <!-- Rolling -->
  <rect x="30" y="80" width="410" height="164" rx="14" fill="#E8EEF7" stroke="#1A5CB5" stroke-width="2.5"/>
  <text x="52" y="108" font-size="14" font-weight="800" fill="#002C5F">🔄 롤링 (Rolling)</text>
  <text x="52" y="128" font-size="10.5" fill="#555555">인스턴스를 하나씩 순차로 새 버전으로 교체</text>
  <rect x="52" y="140" width="52" height="34" rx="7" fill="#7FD1A8"/><text x="78" y="162" font-size="10" font-weight="700" fill="#0D1B2E" text-anchor="middle">new</text>
  <rect x="110" y="140" width="52" height="34" rx="7" fill="#7FD1A8"/><text x="136" y="162" font-size="10" font-weight="700" fill="#0D1B2E" text-anchor="middle">new</text>
  <rect x="168" y="140" width="52" height="34" rx="7" fill="#B5AFA5"/><text x="194" y="162" font-size="10" font-weight="700" fill="#1A1A1A" text-anchor="middle">old</text>
  <rect x="226" y="140" width="52" height="34" rx="7" fill="#B5AFA5"/><text x="252" y="162" font-size="10" font-weight="700" fill="#1A1A1A" text-anchor="middle">old</text>
  <text x="300" y="162" font-size="10.5" fill="#666666">→ 순차 교체 중</text>
  <text x="52" y="196" font-size="10" fill="#065F46">✓ 추가 자원이 거의 안 든다 · 무중단</text>
  <text x="52" y="216" font-size="10" fill="#991B1B">✕ 교체 중에 두 버전이 공존한다 (DB 호환성 주의)</text>
  <text x="52" y="234" font-size="10" fill="#666666">되돌리기: 다시 순차 교체 — 조금 느리다</text>

  <!-- Blue-Green -->
  <rect x="460" y="80" width="410" height="164" rx="14" fill="#E6F7F1" stroke="#0F766E" stroke-width="2.5"/>
  <text x="482" y="108" font-size="14" font-weight="800" fill="#0F766E">🔵🟢 블루-그린 (Blue-Green)</text>
  <text x="482" y="128" font-size="10.5" fill="#555555">두 환경을 통째로 준비하고 트래픽을 한 번에 스위치</text>
  <rect x="482" y="140" width="120" height="40" rx="8" fill="#1A5CB5"/>
  <text x="542" y="165" font-size="11" font-weight="800" fill="#FFF" text-anchor="middle">Blue (구버전)</text>
  <rect x="616" y="140" width="120" height="40" rx="8" fill="#00AA6C"/>
  <text x="676" y="165" font-size="11" font-weight="800" fill="#FFF" text-anchor="middle">Green (신버전)</text>
  <line x1="606" y1="160" x2="612" y2="160" stroke="#003F8A" stroke-width="2"/>
  <text x="756" y="158" font-size="10.5" font-weight="700" fill="#0F766E">트래픽</text>
  <text x="756" y="174" font-size="10.5" font-weight="700" fill="#0F766E">스위치 →</text>
  <text x="482" y="200" font-size="10" fill="#065F46">✓ 롤백이 가장 빠르다 — 스위치를 되돌리면 끝</text>
  <text x="482" y="220" font-size="10" fill="#991B1B">✕ 환경을 두 벌 유지 — 자원이 두 배</text>
  <text x="482" y="238" font-size="10" fill="#666666">되돌리기: 즉시 (초 단위)</text>

  <!-- Canary -->
  <rect x="30" y="264" width="410" height="176" rx="14" fill="#FEF3E2" stroke="#E8962A" stroke-width="3"/>
  <text x="52" y="292" font-size="14" font-weight="800" fill="#B45309">🐤 카나리아 (Canary)</text>
  <text x="52" y="312" font-size="10.5" fill="#555555">소수에게 먼저 노출하고 지표를 보며 비율을 올린다</text>
  <rect x="52" y="326" width="336" height="26" rx="6" fill="#B5AFA5"/>
  <rect x="52" y="326" width="34" height="26" rx="6" fill="#E8962A"/>
  <text x="69" y="344" font-size="9.5" font-weight="800" fill="#FFF" text-anchor="middle">1%</text>
  <text x="240" y="344" font-size="10" font-weight="700" fill="#1A1A1A" text-anchor="middle">나머지 99%는 구버전</text>
  <text x="52" y="374" font-size="10.5" fill="#555555">1% → 지표 확인 → 10% → 확인 → 50% → 100%</text>
  <text x="52" y="396" font-size="10" fill="#065F46">✓ 사고의 <tspan font-weight="700">피해 범위</tspan>를 좁힌다 — 실전 검증</text>
  <text x="52" y="416" font-size="10" fill="#991B1B">✕ 모니터링이 없으면 무의미 (지표를 봐야 판단한다)</text>
  <text x="52" y="434" font-size="10" fill="#666666">되돌리기: 비율을 0으로 — 빠르다</text>

  <!-- Feature Flag -->
  <rect x="460" y="264" width="410" height="176" rx="14" fill="#F3E8FF" stroke="#6B21A8" stroke-width="3"/>
  <text x="482" y="292" font-size="14" font-weight="800" fill="#6B21A8">🎚 기능 스위치 (Feature Flag)</text>
  <text x="482" y="312" font-size="10.5" fill="#555555">코드는 이미 배포돼 있고, <tspan font-weight="700">켜고 끄는 것은 별도 결정</tspan></text>
  <rect x="482" y="326" width="160" height="42" rx="8" fill="#FFFFFF" stroke="#6B21A8" stroke-width="1.5"/>
  <text x="562" y="343" font-size="10" fill="#555555" text-anchor="middle">새 기능 코드 (배포됨)</text>
  <text x="562" y="360" font-size="10" font-weight="800" fill="#8A8478" text-anchor="middle">상태: OFF</text>
  <rect x="656" y="326" width="180" height="42" rx="8" fill="#F3E8FF" stroke="#6B21A8" stroke-width="1.5"/>
  <text x="746" y="343" font-size="10" fill="#555555" text-anchor="middle">관리 화면에서 ON →</text>
  <text x="746" y="360" font-size="10" font-weight="800" fill="#6B21A8" text-anchor="middle">특정 사용자군에만 노출</text>
  <text x="482" y="392" font-size="10" fill="#065F46">✓ <tspan font-weight="700">배포와 릴리스를 분리</tspan> — 배포는 매일, 공개는 원하는 날</text>
  <text x="482" y="412" font-size="10" fill="#991B1B">✕ 스위치가 쌓이면 코드가 지저분해진다 (정리 규칙 필요)</text>
  <text x="482" y="430" font-size="10" fill="#666666">되돌리기: 스위치 OFF — 배포 없이 즉시</text>

  <!-- 공통 전제 -->
  <rect x="30" y="460" width="840" height="112" rx="12" fill="#FFFFFF" stroke="#B5AFA5" stroke-width="1.5"/>
  <text x="52" y="488" font-size="13" font-weight="800" fill="#002C5F">어느 전략이든 공통으로 필요한 것</text>
  <text x="52" y="514" font-size="10.5" fill="#555555">· <tspan font-weight="700">모니터링</tspan> — 나빠진 것을 알아채지 못하면 어떤 전략도 소용없다 (에러율·응답시간·핵심 지표)</text>
  <text x="52" y="536" font-size="10.5" fill="#555555">· <tspan font-weight="700">롤백 경로</tspan> — "되돌리는 방법"을 배포 전에 정해둔다 (사고 중에 고민하면 늦다)</text>
  <text x="52" y="558" font-size="10.5" fill="#555555">· <tspan font-weight="700">DB 마이그레이션 전략</tspan> — 코드는 되돌려도 <u>데이터는 되돌리기 어렵다</u>. 구·신 버전이 함께 읽을 수 있게 설계</text>

  <!-- 하단 -->
  <rect x="30" y="588" width="840" height="52" rx="12" fill="#0D1B2E"/>
  <text x="450" y="612" font-size="12.5" font-weight="800" fill="#FFF" text-anchor="middle">개인·소규모라면 과하게 고르지 말 것 — 대개 "롤링 + 되돌릴 수 있는 배포" 하나면 충분하다</text>
  <text x="450" y="632" font-size="11" fill="#AAB9CF" text-anchor="middle">카나리아·기능 스위치는 사용자가 많아져 "사고의 비용"이 커졌을 때 도입한다</text>
</svg>
