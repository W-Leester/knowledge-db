<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="moa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#003F8A"/>
    </marker>
    <marker id="mog" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00AA6C"/>
    </marker>
  </defs>
  <rect width="900" height="700" fill="#FAF7F2"/>
  <text x="450" y="34" font-size="20" font-weight="800" fill="#002C5F" text-anchor="middle">애플 실리콘 전용 스택 — MLX(프레임워크)와 oMLX(서버)</text>
  <text x="450" y="58" font-size="13" fill="#8A8A8A" text-anchor="middle">"PyTorch에게 CUDA가 있다면, 애플 실리콘에는 MLX가 있다" — 그리고 oMLX가 그걸 서버로 만든다</text>

  <!-- 왼쪽: 스택 -->
  <rect x="30" y="80" width="400" height="360" rx="14" fill="#FFFFFF" stroke="#B5AFA5" stroke-width="1.5"/>
  <text x="230" y="108" font-size="14" font-weight="800" fill="#002C5F" text-anchor="middle">층으로 본 위치</text>

  <rect x="55" y="122" width="350" height="52" rx="10" fill="#E8EEF7" stroke="#1A5CB5" stroke-width="2"/>
  <text x="230" y="144" font-size="12.5" font-weight="800" fill="#002C5F" text-anchor="middle">🍎 애플 실리콘 하드웨어</text>
  <text x="230" y="162" font-size="10.5" fill="#555555" text-anchor="middle">통합 메모리(CPU·GPU 공유) + Metal GPU</text>

  <line x1="230" y1="174" x2="230" y2="188" stroke="#003F8A" stroke-width="2" marker-end="url(#moa)"/>
  <rect x="55" y="192" width="350" height="52" rx="10" fill="#FEF3E2" stroke="#E8962A" stroke-width="2"/>
  <text x="230" y="214" font-size="12.5" font-weight="800" fill="#B45309" text-anchor="middle">MLX — 애플의 ML 프레임워크</text>
  <text x="230" y="232" font-size="10.5" fill="#555555" text-anchor="middle">통합 메모리 전제 설계 · 지연 평가 · Metal 커널</text>

  <line x1="230" y1="244" x2="230" y2="258" stroke="#003F8A" stroke-width="2" marker-end="url(#moa)"/>
  <rect x="55" y="262" width="350" height="52" rx="10" fill="#FEF3E2" stroke="#E8962A" stroke-width="1.5"/>
  <text x="230" y="284" font-size="12.5" font-weight="700" fill="#B45309" text-anchor="middle">mlx-lm · mlx-vlm — 모델 실행 라이브러리</text>
  <text x="230" y="302" font-size="10.5" fill="#555555" text-anchor="middle">HuggingFace mlx-community의 변환·양자화 모델</text>

  <line x1="230" y1="314" x2="230" y2="328" stroke="#003F8A" stroke-width="2" marker-end="url(#moa)"/>
  <rect x="55" y="332" width="350" height="52" rx="10" fill="#FEE2E2" stroke="#9F1239" stroke-width="2.5"/>
  <text x="230" y="354" font-size="12.5" font-weight="800" fill="#9F1239" text-anchor="middle">oMLX — 추론 서버 (이 그림의 주인공)</text>
  <text x="230" y="372" font-size="10.5" fill="#555555" text-anchor="middle">연속 배칭 · 계층 KV 캐시 · 멀티모델 · 메뉴바 앱</text>

  <line x1="230" y1="384" x2="230" y2="398" stroke="#003F8A" stroke-width="2" marker-end="url(#moa)"/>
  <rect x="55" y="402" width="350" height="30" rx="8" fill="#0D1B2E"/>
  <text x="230" y="422" font-size="11" font-weight="700" fill="#7FD1A8" text-anchor="middle">OpenAI 호환 + Anthropic /v1/messages + 임베딩·리랭크</text>

  <!-- 오른쪽: 계층형 KV 캐시 -->
  <rect x="460" y="80" width="410" height="360" rx="14" fill="#E6F7F1" stroke="#00AA6C" stroke-width="2.5"/>
  <text x="665" y="108" font-size="14" font-weight="800" fill="#065F46" text-anchor="middle">간판 기능 — 계층형 KV 캐시 (RAM+SSD)</text>
  <text x="665" y="128" font-size="10.5" fill="#8A8A8A" text-anchor="middle">에이전트 대화 = 거대한 공통 접두사 + 계속 바뀌는 꼬리</text>

  <rect x="482" y="142" width="366" height="56" rx="10" fill="#FFFFFF"/>
  <text x="500" y="164" font-size="11.5" font-weight="800" fill="#065F46">🔥 Hot 층 (RAM)</text>
  <text x="500" y="184" font-size="10.5" fill="#555555">자주 쓰는 캐시 블록 — 시스템 프롬프트·도구 스키마</text>

  <line x1="665" y1="198" x2="665" y2="214" stroke="#00AA6C" stroke-width="2" marker-end="url(#mog)"/>
  <text x="760" y="210" font-size="9.5" fill="#8A8A8A" text-anchor="middle">가득 차면 내려보냄</text>

  <rect x="482" y="218" width="366" height="56" rx="10" fill="#FFFFFF"/>
  <text x="500" y="240" font-size="11.5" font-weight="800" fill="#065F46">❄️ Cold 층 (SSD)</text>
  <text x="500" y="260" font-size="10.5" fill="#555555">밀려난 블록을 디스크에 보존 — 필요하면 복구 (재계산 없이)</text>

  <rect x="482" y="290" width="366" height="64" rx="10" fill="#0D1B2E"/>
  <text x="665" y="314" font-size="11.5" font-weight="800" fill="#FFF" text-anchor="middle">효과: 긴 컨텍스트 첫 토큰 대기(TTFT)</text>
  <text x="665" y="336" font-size="12" font-weight="800" fill="#7FD1A8" text-anchor="middle">30~90초 → 5초 미만 (공식 주장, 개략치)</text>

  <text x="482" y="382" font-size="11" fill="#555555">· 블록 단위 관리(vLLM 영감) — 접두사 공유 + Copy-on-Write</text>
  <text x="482" y="404" font-size="11" fill="#555555">· Ollama·LM Studio는 컨텍스트가 중간에 바뀌면 전체 재계산</text>
  <text x="482" y="426" font-size="11" fill="#B45309">· 에이전트처럼 "같은 접두사로 수십 번 왕복"하는 워크로드에 결정적</text>

  <!-- 하단: 3파전 -->
  <text x="450" y="478" font-size="15" font-weight="800" fill="#002C5F" text-anchor="middle">추론 서버 3파전 — 무엇으로 서빙하나</text>

  <rect x="30" y="494" width="270" height="150" rx="12" fill="#E8EEF7" stroke="#1A5CB5" stroke-width="2"/>
  <text x="165" y="520" font-size="13" font-weight="800" fill="#002C5F" text-anchor="middle">llama.cpp</text>
  <text x="50" y="544" font-size="10.5" fill="#555555">· 전 플랫폼 C++ 범용 엔진 (GGUF)</text>
  <text x="50" y="564" font-size="10.5" fill="#555555">· GBNF·json_schema 문법 강제</text>
  <text x="50" y="584" font-size="10.5" fill="#555555">· /v1/messages 지원 (2026.1~)</text>
  <text x="50" y="608" font-size="10.5" font-weight="700" fill="#1A5CB5">→ 이식성·세밀 제어가 필요할 때</text>

  <rect x="315" y="494" width="270" height="150" rx="12" fill="#FEF3E2" stroke="#E8962A" stroke-width="2"/>
  <text x="450" y="520" font-size="13" font-weight="800" fill="#B45309" text-anchor="middle">Ollama</text>
  <text x="335" y="544" font-size="10.5" fill="#555555">· 모델 받기·실행이 명령 한 줄</text>
  <text x="335" y="564" font-size="10.5" fill="#555555">· 생태계 연동(도구·UI)이 가장 많음</text>
  <text x="335" y="584" font-size="10.5" fill="#555555">· 컨텍스트 변경 시 캐시 전체 무효화</text>
  <text x="335" y="608" font-size="10.5" font-weight="700" fill="#B45309">→ 입문·간단 운영의 표준</text>

  <rect x="600" y="494" width="270" height="150" rx="12" fill="#FEE2E2" stroke="#9F1239" stroke-width="2.5"/>
  <text x="735" y="520" font-size="13" font-weight="800" fill="#9F1239" text-anchor="middle">oMLX (맥 전용)</text>
  <text x="620" y="544" font-size="10.5" fill="#555555">· MLX 네이티브 — 애플 실리콘 특화</text>
  <text x="620" y="564" font-size="10.5" fill="#555555">· 계층 KV 캐시 + 연속 배칭</text>
  <text x="620" y="584" font-size="10.5" fill="#555555">· VLM·OCR·임베딩·리랭커까지 한 서버</text>
  <text x="620" y="608" font-size="10.5" font-weight="700" fill="#9F1239">→ 맥 상주 서버 + 에이전트 워크로드</text>

  <rect x="30" y="660" width="840" height="30" rx="8" fill="#0D1B2E"/>
  <text x="450" y="680" font-size="11.5" font-weight="700" fill="#FFF" text-anchor="middle">셋 다 OpenAI 호환이라 하네스 쪽 코드는 base_url만 바꾸면 된다 — 서버는 갈아타도 에이전트는 그대로</text>
</svg>
