<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <rect width="900" height="540" fill="#FAF7F2"/>
  <text x="450" y="34" font-size="20" font-weight="800" fill="#002C5F" text-anchor="middle">M5 Max 128GB의 예산 배분 — 27B는 이 기계에 아주 여유롭다</text>
  <text x="450" y="58" font-size="13" fill="#8A8A8A" text-anchor="middle">통합 메모리라 "VRAM 벽" 없이 한 덩어리로 배분한다 (수치는 개략치)</text>

  <!-- 메모리 바 -->
  <text x="60" y="98" font-size="13" font-weight="800" fill="#002C5F">🧠 통합 메모리 128GB</text>
  <rect x="60" y="110" width="780" height="64" rx="10" fill="#FFFFFF" stroke="#B5AFA5" stroke-width="1.5"/>
  <!-- 모델 29/128 = 176px -->
  <rect x="60" y="110" width="176" height="64" rx="10" fill="#E8962A"/>
  <text x="148" y="138" font-size="11.5" font-weight="800" fill="#FFF" text-anchor="middle">모델 ~29GB</text>
  <text x="148" y="156" font-size="9.5" fill="#FFF7E6" text-anchor="middle">Qwen3.6-27B 8bit</text>
  <!-- KV캐시 ~35GB = 213px -->
  <rect x="236" y="110" width="213" height="64" fill="#1A5CB5"/>
  <text x="342" y="138" font-size="11.5" font-weight="800" fill="#FFF" text-anchor="middle">KV 캐시 여유 ~35GB</text>
  <text x="342" y="156" font-size="9.5" fill="#E8EEF7" text-anchor="middle">10만+ 토큰 컨텍스트도 감당</text>
  <!-- 시스템+Docker ~20GB = 122px -->
  <rect x="449" y="110" width="122" height="64" fill="#065F46"/>
  <text x="510" y="138" font-size="11" font-weight="800" fill="#FFF" text-anchor="middle">macOS+Docker</text>
  <text x="510" y="156" font-size="9.5" fill="#E6F7F1" text-anchor="middle">~20GB</text>
  <!-- 자유 여유 -->
  <rect x="571" y="110" width="269" height="64" fill="#D5CFBF"/>
  <text x="705" y="138" font-size="11.5" font-weight="800" fill="#555555" text-anchor="middle">자유 여유 ~44GB</text>
  <text x="705" y="156" font-size="9.5" fill="#8A8A8A" text-anchor="middle">둘째 모델·임베딩·확장 자리</text>

  <text x="60" y="200" font-size="11" fill="#8A8A8A">→ oMLX에 --memory-guard-gb 96 정도를 걸어두면, 모델+캐시가 아무리 커져도 시스템은 침범 안 함</text>

  <!-- 양자화 선택 -->
  <rect x="60" y="228" width="380" height="150" rx="14" fill="#E8EEF7" stroke="#1A5CB5" stroke-width="2"/>
  <text x="82" y="256" font-size="13" font-weight="800" fill="#002C5F">8bit를 기본으로 (권장)</text>
  <text x="82" y="282" font-size="11.5" fill="#555555">· 품질: bf16과 사실상 동급 (체감 손실 거의 없음)</text>
  <text x="82" y="306" font-size="11.5" fill="#555555">· 속도: 가중치가 절반 → 대역폭 병목에서 ~2배 유리</text>
  <text x="82" y="330" font-size="11.5" fill="#555555">· bf16(~56GB)도 돌아가지만 속도만 잃는 선택</text>
  <text x="82" y="358" font-size="10.5" fill="#8A8A8A">4bit(~17GB)는 코딩 품질이 아까움 — 이 기계에선 불필요한 절약</text>

  <rect x="460" y="228" width="380" height="150" rx="14" fill="#E6F7F1" stroke="#00AA6C" stroke-width="2"/>
  <text x="482" y="256" font-size="13" font-weight="800" fill="#065F46">속도 감각 (개략치 — 직접 재보기)</text>
  <text x="482" y="282" font-size="11.5" fill="#555555">· dense 27B 8bit: 생성 십수~20+ 토큰/초대</text>
  <text x="482" y="306" font-size="11.5" fill="#555555">· 대역폭이 결정 (「AI 하드웨어 — 메모리」)</text>
  <text x="482" y="330" font-size="11.5" fill="#555555">· 긴 프롬프트 반복은 oMLX 캐시가 TTFT를 흡수</text>
  <text x="482" y="358" font-size="10.5" fill="#8A8A8A">더 빠른 왕복이 필요하면 §7의 MoE(A3B급)로 교체 실험</text>

  <!-- SSD -->
  <text x="60" y="420" font-size="13" font-weight="800" fill="#002C5F">💾 SSD 2TB 배분 (개략)</text>
  <rect x="60" y="432" width="780" height="48" rx="10" fill="#FFFFFF" stroke="#B5AFA5" stroke-width="1.5"/>
  <rect x="60" y="432" width="120" height="48" rx="10" fill="#E8962A"/>
  <text x="120" y="452" font-size="10.5" font-weight="800" fill="#FFF" text-anchor="middle">모델 보관</text>
  <text x="120" y="468" font-size="9" fill="#FFF7E6" text-anchor="middle">~150GB (여러 벌)</text>
  <rect x="180" y="432" width="100" height="48" fill="#1A5CB5"/>
  <text x="230" y="452" font-size="10.5" font-weight="800" fill="#FFF" text-anchor="middle">oMLX 캐시</text>
  <text x="230" y="468" font-size="9" fill="#E8EEF7" text-anchor="middle">~100GB 할당</text>
  <rect x="280" y="432" width="130" height="48" fill="#065F46"/>
  <text x="345" y="452" font-size="10.5" font-weight="800" fill="#FFF" text-anchor="middle">프로젝트+로그</text>
  <text x="345" y="468" font-size="9" fill="#E6F7F1" text-anchor="middle">git 저장소·jsonl</text>
  <rect x="410" y="432" width="430" height="48" fill="#D5CFBF"/>
  <text x="625" y="452" font-size="10.5" font-weight="800" fill="#555555" text-anchor="middle">여유 — 시스템·Docker 이미지·기타</text>
  <text x="625" y="468" font-size="9" fill="#8A8A8A" text-anchor="middle">캐시 폴더는 주기 정리 (스크립트 한 줄)</text>

  <rect x="60" y="500" width="780" height="30" rx="8" fill="#0D1B2E"/>
  <text x="450" y="520" font-size="11.5" font-weight="700" fill="#FFF" text-anchor="middle">결론: 이 사양의 병목은 메모리가 아니라 "27B의 지능"이다 — 그래서 검증 루프(§4~5)가 시스템의 진짜 핵심이 된다</text>
</svg>
