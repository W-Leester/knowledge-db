<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <rect width="900" height="640" fill="#FAF7F2"/>
  <text x="450" y="34" font-size="20" font-weight="800" fill="#002C5F" text-anchor="middle">라이선스 스펙트럼 — 자유로움에서 전염성까지</text>
  <text x="450" y="58" font-size="13" fill="#666666" text-anchor="middle">왼쪽으로 갈수록 "가져다 쓰기 편하고", 오른쪽으로 갈수록 "내 코드까지 공개 의무가 번진다"</text>

  <!-- 스펙트럼 바 -->
  <rect x="40" y="84" width="820" height="26" rx="13" fill="#FFFFFF" stroke="#B5AFA5" stroke-width="1.5"/>
  <rect x="40" y="84" width="290" height="26" rx="13" fill="#0F766E"/>
  <rect x="330" y="84" width="180" height="26" fill="#B45309"/>
  <rect x="510" y="84" width="230" height="26" fill="#DC2626"/>
  <rect x="740" y="84" width="120" height="26" rx="13" fill="#4C1D95"/>
  <text x="185" y="102" font-size="11.5" font-weight="800" fill="#FFF" text-anchor="middle">허용형 (permissive)</text>
  <text x="420" y="102" font-size="11.5" font-weight="800" fill="#FFF" text-anchor="middle">약한 전염</text>
  <text x="625" y="102" font-size="11.5" font-weight="800" fill="#FFF" text-anchor="middle">강한 전염 (copyleft)</text>
  <text x="800" y="102" font-size="10.5" font-weight="800" fill="#FFF" text-anchor="middle">비-오픈소스</text>

  <!-- 카드들 -->
  <rect x="40" y="130" width="200" height="150" rx="12" fill="#E6F7F1" stroke="#0F766E" stroke-width="2.5"/>
  <text x="140" y="156" font-size="14" font-weight="800" fill="#0F766E" text-anchor="middle">MIT ★ 기본값</text>
  <text x="56" y="180" font-size="10.5" fill="#555555">의무: 저작권 표시 유지만</text>
  <text x="56" y="200" font-size="10.5" fill="#555555">분량: ~170단어 (다 읽힘)</text>
  <text x="56" y="220" font-size="10.5" fill="#555555">상업적 사용·수정·비공개 자유</text>
  <text x="56" y="244" font-size="10" fill="#666666">React · jQuery · Rails</text>
  <text x="56" y="266" font-size="10" font-weight="700" fill="#065F46">개인 프로젝트의 무난한 답</text>

  <rect x="252" y="130" width="200" height="150" rx="12" fill="#E6F7F1" stroke="#0F766E" stroke-width="2"/>
  <text x="352" y="156" font-size="14" font-weight="800" fill="#0F766E" text-anchor="middle">Apache 2.0</text>
  <text x="268" y="180" font-size="10.5" fill="#555555">MIT의 전부 + <tspan font-weight="700">특허 조항</tspan></text>
  <text x="268" y="200" font-size="10.5" fill="#555555">기여자의 특허 공격 차단</text>
  <text x="268" y="220" font-size="10.5" fill="#555555">변경 사항 명시 의무 추가</text>
  <text x="268" y="244" font-size="10" fill="#666666">Kubernetes · Swift · gpt-oss</text>
  <text x="268" y="266" font-size="10" font-weight="700" fill="#065F46">기업이 갖다 쓸 것 같으면</text>

  <rect x="464" y="130" width="200" height="150" rx="12" fill="#FEF3E2" stroke="#B45309" stroke-width="2"/>
  <text x="564" y="156" font-size="14" font-weight="800" fill="#B45309" text-anchor="middle">LGPL</text>
  <text x="480" y="180" font-size="10.5" fill="#555555">링크해서 쓰는 건 자유</text>
  <text x="480" y="200" font-size="10.5" fill="#555555"><tspan font-weight="700">그 라이브러리를 수정</tspan>하면</text>
  <text x="490" y="216" font-size="10.5" fill="#555555">그 부분만 공개</text>
  <text x="480" y="240" font-size="10" fill="#666666">glibc 등 시스템 라이브러리</text>
  <text x="480" y="264" font-size="10" font-weight="700" fill="#B45309">보통은 그냥 써도 안전</text>

  <rect x="676" y="130" width="184" height="150" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="768" y="156" font-size="14" font-weight="800" fill="#DC2626" text-anchor="middle">GPL v2 / v3</text>
  <text x="692" y="180" font-size="10.5" fill="#555555"><tspan font-weight="700">내 코드까지 GPL로</tspan></text>
  <text x="692" y="198" font-size="10.5" fill="#555555">배포 시 전체 소스 공개</text>
  <text x="692" y="218" font-size="10.5" fill="#555555">MIT로 낼 수 없게 된다</text>
  <text x="692" y="242" font-size="10" fill="#666666">Linux(v2) · Bash · GIMP</text>
  <text x="692" y="264" font-size="10" font-weight="700" fill="#DC2626">의존성으로 들어오면 위험</text>

  <!-- 아래 줄 -->
  <rect x="40" y="296" width="290" height="140" rx="12" fill="#FEE2E2" stroke="#991B1B" stroke-width="3"/>
  <text x="185" y="322" font-size="14" font-weight="800" fill="#991B1B" text-anchor="middle">AGPL v3 — 가장 강함</text>
  <text x="56" y="346" font-size="10.5" fill="#555555">GPL의 모든 것 +</text>
  <text x="56" y="366" font-size="10.5" font-weight="700" fill="#991B1B">네트워크로 서비스만 해도 공개</text>
  <text x="56" y="386" font-size="10.5" fill="#555555">→ 배포를 안 해도 의무 발생</text>
  <text x="56" y="408" font-size="10" fill="#666666">앱을 웹 서비스로 만들 계획이면</text>
  <text x="56" y="424" font-size="10" fill="#666666">특히 조심 (SaaS의 함정)</text>

  <rect x="342" y="296" width="290" height="140" rx="12" fill="#F3E8FF" stroke="#4C1D95" stroke-width="2.5"/>
  <text x="487" y="322" font-size="14" font-weight="800" fill="#4C1D95" text-anchor="middle">비-오픈소스 (이름이 헷갈림)</text>
  <text x="358" y="346" font-size="10.5" fill="#555555">SSPL · BSL · "source available"</text>
  <text x="358" y="366" font-size="10.5" fill="#555555">소스는 보이지만 <tspan font-weight="700">오픈소스 아님</tspan></text>
  <text x="358" y="386" font-size="10.5" fill="#555555">상업적 사용·클라우드 제공 제한</text>
  <text x="358" y="408" font-size="10" fill="#666666">Redis(최근) · Elastic · MongoDB</text>
  <text x="358" y="424" font-size="10" fill="#666666">"GitHub에 있으니 자유"가 아니다</text>

  <rect x="644" y="296" width="216" height="140" rx="12" fill="#F2EDE4" stroke="#8A8478" stroke-width="2.5"/>
  <text x="752" y="322" font-size="14" font-weight="800" fill="#555555" text-anchor="middle">라이선스 없음 ⚠️</text>
  <text x="660" y="346" font-size="10.5" fill="#555555">LICENSE 파일이 없으면</text>
  <text x="660" y="366" font-size="10.5" font-weight="700" fill="#991B1B">"자유"가 아니라 "저작권 전부 보유"</text>
  <text x="660" y="386" font-size="10.5" fill="#555555">→ 법적으로 사용 권한이 없다</text>
  <text x="660" y="410" font-size="10" fill="#666666">GitHub 공개 ≠ 사용 허락</text>
  <text x="660" y="426" font-size="10" fill="#666666">내 저장소에도 반드시 넣을 것</text>

  <!-- 판별 요약 -->
  <rect x="40" y="452" width="820" height="86" rx="12" fill="#E8EEF7" stroke="#1A5CB5" stroke-width="2"/>
  <text x="450" y="478" font-size="13" font-weight="800" fill="#002C5F" text-anchor="middle">의존성 검사에서 무엇을 보나 — 3색 신호등</text>
  <text x="140" y="504" font-size="11" font-weight="800" fill="#065F46" text-anchor="middle">🟢 통과</text>
  <text x="140" y="524" font-size="10" fill="#555555" text-anchor="middle">MIT · Apache · BSD · ISC</text>
  <text x="450" y="504" font-size="11" font-weight="800" fill="#B45309" text-anchor="middle">🟡 확인 필요</text>
  <text x="450" y="524" font-size="10" fill="#555555" text-anchor="middle">LGPL · MPL — 수정 여부·링크 방식 확인</text>
  <text x="760" y="504" font-size="11" font-weight="800" fill="#DC2626" text-anchor="middle">🔴 중단·대체</text>
  <text x="760" y="524" font-size="10" fill="#555555" text-anchor="middle">GPL · AGPL · SSPL · 라이선스 없음</text>

  <rect x="40" y="554" width="820" height="56" rx="12" fill="#0D1B2E"/>
  <text x="450" y="580" font-size="12.5" font-weight="800" fill="#FFF" text-anchor="middle">기억할 한 가지: "전염"은 배포할 때 발동한다 — 내 컴퓨터에서만 쓰면 GPL도 문제없다</text>
  <text x="450" y="600" font-size="11" fill="#AAB9CF" text-anchor="middle">그러나 바이브코딩의 결과물은 대개 GitHub에 올라가고(=배포), AGPL은 서비스 제공만으로도 발동한다</text>
</svg>
