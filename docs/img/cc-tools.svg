<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <rect width="900" height="720" fill="#FAF7F2"/>
  <text x="450" y="34" font-size="20" font-weight="800" fill="#002C5F" text-anchor="middle">툴 지형 — 파이프라인의 어느 자리에 무엇이 사는가</text>
  <text x="450" y="58" font-size="13" fill="#666666" text-anchor="middle">이름을 외우지 말고 "이 도구는 어느 칸을 채우나"로 읽는다 (2026.08 기준 · 대표적인 것들)</text>

  <!-- 1. 실행판 -->
  <rect x="30" y="80" width="840" height="112" rx="14" fill="#E8EEF7" stroke="#1A5CB5" stroke-width="2.5"/>
  <text x="52" y="108" font-size="14" font-weight="800" fill="#002C5F">① 파이프라인 실행판 — "누가 이 과정을 돌리나"</text>
  <rect x="52" y="120" width="188" height="56" rx="9" fill="#FFFFFF" stroke="#1A5CB5" stroke-width="1.8"/>
  <text x="146" y="142" font-size="11.5" font-weight="800" fill="#002C5F" text-anchor="middle">GitHub Actions</text>
  <text x="146" y="162" font-size="9.5" fill="#555555" text-anchor="middle">저장소에 붙어 있어 시작이 가장 쉽다</text>
  <rect x="250" y="120" width="150" height="56" rx="9" fill="#FFFFFF" stroke="#1A5CB5" stroke-width="1.2"/>
  <text x="325" y="142" font-size="11.5" font-weight="800" fill="#002C5F" text-anchor="middle">GitLab CI/CD</text>
  <text x="325" y="162" font-size="9.5" fill="#555555" text-anchor="middle">GitLab 내장 · 통합형</text>
  <rect x="410" y="120" width="150" height="56" rx="9" fill="#FFFFFF" stroke="#1A5CB5" stroke-width="1.2"/>
  <text x="485" y="142" font-size="11.5" font-weight="800" fill="#002C5F" text-anchor="middle">Jenkins</text>
  <text x="485" y="162" font-size="9.5" fill="#555555" text-anchor="middle">자체 호스팅의 고전 · 플러그인 방대</text>
  <rect x="570" y="120" width="140" height="56" rx="9" fill="#FFFFFF" stroke="#1A5CB5" stroke-width="1.2"/>
  <text x="640" y="142" font-size="11.5" font-weight="800" fill="#002C5F" text-anchor="middle">CircleCI · Buildkite</text>
  <text x="640" y="162" font-size="9.5" fill="#555555" text-anchor="middle">SaaS · 하이브리드</text>
  <rect x="720" y="120" width="130" height="56" rx="9" fill="#FFFFFF" stroke="#1A5CB5" stroke-width="1.2"/>
  <text x="785" y="142" font-size="11.5" font-weight="800" fill="#002C5F" text-anchor="middle">클라우드 벤더</text>
  <text x="785" y="162" font-size="9.5" fill="#555555" text-anchor="middle">Azure · AWS · GCP</text>

  <!-- 2. 품질 게이트 -->
  <rect x="30" y="204" width="840" height="164" rx="14" fill="#E6F7F1" stroke="#0F766E" stroke-width="2.5"/>
  <text x="52" y="232" font-size="14" font-weight="800" fill="#0F766E">② 품질 게이트 — "무엇을 검사하나" (CI의 알맹이)</text>
  <rect x="52" y="244" width="192" height="52" rx="9" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.2"/>
  <text x="148" y="264" font-size="11" font-weight="800" fill="#065F46" text-anchor="middle">테스트</text>
  <text x="148" y="284" font-size="9.5" fill="#555555" text-anchor="middle">Vitest·Jest · pytest · JUnit · go test</text>
  <rect x="254" y="244" width="192" height="52" rx="9" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.2"/>
  <text x="350" y="264" font-size="11" font-weight="800" fill="#065F46" text-anchor="middle">린트 · 포맷</text>
  <text x="350" y="284" font-size="9.5" fill="#555555" text-anchor="middle">ESLint · Biome · Ruff · golangci-lint</text>
  <rect x="456" y="244" width="192" height="52" rx="9" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.2"/>
  <text x="552" y="264" font-size="11" font-weight="800" fill="#065F46" text-anchor="middle">타입 검사</text>
  <text x="552" y="284" font-size="9.5" fill="#555555" text-anchor="middle">tsc · mypy — AI 코드의 공짜 게이트</text>
  <rect x="658" y="244" width="192" height="52" rx="9" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.2"/>
  <text x="754" y="264" font-size="11" font-weight="800" fill="#065F46" text-anchor="middle">커버리지</text>
  <text x="754" y="284" font-size="9.5" fill="#555555" text-anchor="middle">Codecov · Coveralls</text>

  <rect x="52" y="304" width="192" height="52" rx="9" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="148" y="324" font-size="11" font-weight="800" fill="#DC2626" text-anchor="middle">보안 — 취약점</text>
  <text x="148" y="344" font-size="9.5" fill="#555555" text-anchor="middle">Dependabot · Snyk · Trivy</text>
  <rect x="254" y="304" width="192" height="52" rx="9" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="350" y="324" font-size="11" font-weight="800" fill="#DC2626" text-anchor="middle">보안 — 코드·비밀</text>
  <text x="350" y="344" font-size="9.5" fill="#555555" text-anchor="middle">CodeQL(SAST) · gitleaks(시크릿)</text>
  <rect x="456" y="304" width="192" height="52" rx="9" fill="#FEF3E2" stroke="#E8962A" stroke-width="1.5"/>
  <text x="552" y="324" font-size="11" font-weight="800" fill="#B45309" text-anchor="middle">라이선스</text>
  <text x="552" y="344" font-size="9.5" fill="#555555" text-anchor="middle">license-checker · FOSSA (게이트 ③)</text>
  <rect x="658" y="304" width="192" height="52" rx="9" fill="#F3E8FF" stroke="#6B21A8" stroke-width="1.5"/>
  <text x="754" y="324" font-size="11" font-weight="800" fill="#6B21A8" text-anchor="middle">AI 리뷰</text>
  <text x="754" y="344" font-size="9.5" fill="#555555" text-anchor="middle">LLM이 diff를 검토 (피라미드 2층)</text>

  <!-- 3. 배포판 -->
  <rect x="30" y="380" width="840" height="112" rx="14" fill="#FEF3E2" stroke="#E8962A" stroke-width="2.5"/>
  <text x="52" y="408" font-size="14" font-weight="800" fill="#B45309">③ 배포판 — "어디에 올리나"</text>
  <rect x="52" y="420" width="196" height="56" rx="9" fill="#FFFFFF" stroke="#E8962A" stroke-width="1.8"/>
  <text x="150" y="440" font-size="11.5" font-weight="800" fill="#B45309" text-anchor="middle">PaaS (가장 쉬움)</text>
  <text x="150" y="460" font-size="9.5" fill="#555555" text-anchor="middle">Vercel · Netlify · Railway · Render · Fly.io</text>
  <rect x="258" y="420" width="196" height="56" rx="9" fill="#FFFFFF" stroke="#E8962A" stroke-width="1.2"/>
  <text x="356" y="440" font-size="11.5" font-weight="800" fill="#B45309" text-anchor="middle">정적 호스팅</text>
  <text x="356" y="460" font-size="9.5" fill="#555555" text-anchor="middle">GitHub Pages · Cloudflare Pages</text>
  <rect x="464" y="420" width="196" height="56" rx="9" fill="#FFFFFF" stroke="#E8962A" stroke-width="1.2"/>
  <text x="562" y="440" font-size="11.5" font-weight="800" fill="#B45309" text-anchor="middle">컨테이너</text>
  <text x="562" y="460" font-size="9.5" fill="#555555" text-anchor="middle">Docker → 레지스트리 → 실행 환경</text>
  <rect x="670" y="420" width="180" height="56" rx="9" fill="#FFFFFF" stroke="#E8962A" stroke-width="1.2"/>
  <text x="760" y="440" font-size="11.5" font-weight="800" fill="#B45309" text-anchor="middle">GitOps (K8s)</text>
  <text x="760" y="460" font-size="9.5" fill="#555555" text-anchor="middle">ArgoCD · Flux · Helm</text>

  <!-- 4. 주변 도구 -->
  <rect x="30" y="504" width="840" height="112" rx="14" fill="#F3E8FF" stroke="#6B21A8" stroke-width="2.5"/>
  <text x="52" y="532" font-size="14" font-weight="800" fill="#6B21A8">④ 주변 도구 — 파이프라인을 둘러싼 것들</text>
  <rect x="52" y="544" width="192" height="56" rx="9" fill="#FFFFFF" stroke="#6B21A8" stroke-width="1.2"/>
  <text x="148" y="564" font-size="11" font-weight="800" fill="#6B21A8" text-anchor="middle">커밋 전 훅 (로컬)</text>
  <text x="148" y="584" font-size="9.5" fill="#555555" text-anchor="middle">pre-commit · Husky + lint-staged</text>
  <rect x="254" y="544" width="192" height="56" rx="9" fill="#FFFFFF" stroke="#6B21A8" stroke-width="1.2"/>
  <text x="350" y="564" font-size="11" font-weight="800" fill="#6B21A8" text-anchor="middle">의존성 자동 갱신</text>
  <text x="350" y="584" font-size="9.5" fill="#555555" text-anchor="middle">Renovate · Dependabot</text>
  <rect x="456" y="544" width="192" height="56" rx="9" fill="#FFFFFF" stroke="#6B21A8" stroke-width="1.2"/>
  <text x="552" y="564" font-size="11" font-weight="800" fill="#6B21A8" text-anchor="middle">기능 스위치</text>
  <text x="552" y="584" font-size="9.5" fill="#555555" text-anchor="middle">Unleash(OSS) · LaunchDarkly · Flagsmith</text>
  <rect x="658" y="544" width="192" height="56" rx="9" fill="#FFFFFF" stroke="#6B21A8" stroke-width="1.2"/>
  <text x="754" y="564" font-size="11" font-weight="800" fill="#6B21A8" text-anchor="middle">릴리스 자동화</text>
  <text x="754" y="584" font-size="9.5" fill="#555555" text-anchor="middle">semantic-release · changesets</text>

  <!-- 하단 -->
  <rect x="30" y="628" width="840" height="72" rx="12" fill="#0D1B2E"/>
  <text x="450" y="654" font-size="12.5" font-weight="800" fill="#FFF" text-anchor="middle">시작하는 순서: ①에서 하나 고르고(대개 GitHub Actions) → ②를 하나씩 늘리고 → ③은 이미 쓰는 곳에 맞춘다</text>
  <text x="450" y="676" font-size="11" fill="#AAB9CF" text-anchor="middle">④는 필요가 생겼을 때 — 처음부터 다 갖추려 들면 파이프라인 만들다 제품을 못 만든다</text>
  <text x="450" y="694" font-size="10.5" fill="#7FD1A8" text-anchor="middle">도구는 바뀌지만 칸은 남는다 — 새 이름을 만나면 "몇 번 칸인가"로 분류하면 된다</text>
</svg>
