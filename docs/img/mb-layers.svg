<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <rect width="900" height="660" fill="#FAF7F2"/>
  <text x="450" y="34" font-size="20" font-weight="800" fill="#002C5F" text-anchor="middle">이름의 층 — Kotlin은 언어, Flutter는 프레임워크</text>
  <text x="450" y="58" font-size="13" fill="#666666" text-anchor="middle">모바일 이름이 헷갈리는 이유: 나란히 불리지만 서로 다른 층의 물건이다</text>

  <!-- 세 질문 -->
  <rect x="30" y="80" width="840" height="58" rx="12" fill="#0D1B2E"/>
  <text x="450" y="104" font-size="12.5" font-weight="800" fill="#FFF" text-anchor="middle">이름을 만나면 세 질문으로 분류한다</text>
  <text x="180" y="126" font-size="11" fill="#7FD1A8" text-anchor="middle">① 무엇으로 쓰는가 = 언어</text>
  <text x="450" y="126" font-size="11" fill="#7FD1A8" text-anchor="middle">② 무엇이 화면을 그리는가 = 프레임워크</text>
  <text x="730" y="126" font-size="11" fill="#7FD1A8" text-anchor="middle">③ 무엇으로 빌드하는가 = 툴체인</text>

  <!-- 1층 언어 -->
  <rect x="30" y="156" width="840" height="120" rx="14" fill="#E8EEF7" stroke="#1A5CB5" stroke-width="2.5"/>
  <text x="52" y="182" font-size="14" font-weight="800" fill="#002C5F">1층 · 언어 — 내가 타이핑하는 것</text>
  <rect x="52" y="194" width="118" height="64" rx="10" fill="#FFFFFF" stroke="#1A5CB5" stroke-width="2"/>
  <text x="111" y="218" font-size="12.5" font-weight="800" fill="#002C5F" text-anchor="middle">Kotlin</text>
  <text x="111" y="238" font-size="9.5" fill="#555555" text-anchor="middle">안드로이드 공식</text>
  <rect x="180" y="194" width="118" height="64" rx="10" fill="#FFFFFF" stroke="#1A5CB5" stroke-width="2"/>
  <text x="239" y="218" font-size="12.5" font-weight="800" fill="#002C5F" text-anchor="middle">Swift</text>
  <text x="239" y="238" font-size="9.5" fill="#555555" text-anchor="middle">애플 공식</text>
  <rect x="308" y="194" width="118" height="64" rx="10" fill="#FFFFFF" stroke="#8A8478" stroke-width="1.5"/>
  <text x="367" y="218" font-size="12.5" font-weight="800" fill="#555555" text-anchor="middle">Dart</text>
  <text x="367" y="238" font-size="9.5" fill="#555555" text-anchor="middle">Flutter를 쓰려면</text>
  <rect x="436" y="194" width="140" height="64" rx="10" fill="#FFFFFF" stroke="#8A8478" stroke-width="1.5"/>
  <text x="506" y="218" font-size="12.5" font-weight="800" fill="#555555" text-anchor="middle">JS · TypeScript</text>
  <text x="506" y="238" font-size="9.5" fill="#555555" text-anchor="middle">React Native</text>
  <rect x="586" y="194" width="100" height="64" rx="10" fill="#F2EDE4" stroke="#8A8478" stroke-width="1.5"/>
  <text x="636" y="218" font-size="12" font-weight="700" fill="#6F6A60" text-anchor="middle">Java</text>
  <text x="636" y="238" font-size="9.5" fill="#6F6A60" text-anchor="middle">레거시</text>
  <rect x="696" y="194" width="150" height="64" rx="10" fill="#F2EDE4" stroke="#8A8478" stroke-width="1.5"/>
  <text x="771" y="218" font-size="12" font-weight="700" fill="#6F6A60" text-anchor="middle">Objective-C</text>
  <text x="771" y="238" font-size="9.5" fill="#6F6A60" text-anchor="middle">레거시</text>

  <!-- 5층 프레임워크 -->
  <rect x="30" y="292" width="840" height="150" rx="14" fill="#E6F7F1" stroke="#0F766E" stroke-width="2.5"/>
  <text x="52" y="318" font-size="14" font-weight="800" fill="#0F766E">5층 · UI 프레임워크 — 화면을 그리고, 내 코드를 불러주는 뼈대</text>
  <text x="52" y="338" font-size="10" fill="#555555">「기술 스택 고르기」 §5의 제어의 역전 — 내가 부르는 게 아니라 뼈대가 나를 부른다</text>
  <rect x="52" y="350" width="185" height="76" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="144" y="374" font-size="12.5" font-weight="800" fill="#0F766E" text-anchor="middle">Jetpack Compose</text>
  <text x="144" y="393" font-size="9.5" fill="#555555" text-anchor="middle">Kotlin으로 쓴다 · 안드로이드</text>
  <text x="144" y="411" font-size="9.5" fill="#555555" text-anchor="middle">(구식: XML 레이아웃)</text>
  <rect x="247" y="350" width="150" height="76" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="322" y="374" font-size="12.5" font-weight="800" fill="#0F766E" text-anchor="middle">SwiftUI</text>
  <text x="322" y="393" font-size="9.5" fill="#555555" text-anchor="middle">Swift로 쓴다 · iOS</text>
  <text x="322" y="411" font-size="9.5" fill="#555555" text-anchor="middle">(구식: UIKit)</text>
  <rect x="407" y="350" width="150" height="76" rx="10" fill="#FEF3E2" stroke="#E8962A" stroke-width="2.5"/>
  <text x="482" y="374" font-size="12.5" font-weight="800" fill="#AF5109" text-anchor="middle">Flutter</text>
  <text x="482" y="393" font-size="9.5" fill="#555555" text-anchor="middle">Dart로 쓴다</text>
  <text x="482" y="411" font-size="9.5" fill="#555555" text-anchor="middle">안드로이드 + iOS 동시</text>
  <rect x="567" y="350" width="150" height="76" rx="10" fill="#FEF3E2" stroke="#E8962A" stroke-width="2.5"/>
  <text x="642" y="374" font-size="12.5" font-weight="800" fill="#AF5109" text-anchor="middle">React Native</text>
  <text x="642" y="393" font-size="9.5" fill="#555555" text-anchor="middle">JS·TS로 쓴다</text>
  <text x="642" y="411" font-size="9.5" fill="#555555" text-anchor="middle">안드로이드 + iOS 동시</text>
  <rect x="727" y="350" width="119" height="76" rx="10" fill="#F3E8FF" stroke="#6B21A8" stroke-width="2"/>
  <text x="786" y="374" font-size="12" font-weight="800" fill="#6B21A8" text-anchor="middle">KMP</text>
  <text x="786" y="393" font-size="9" fill="#555555" text-anchor="middle">Kotlin으로 쓴다</text>
  <text x="786" y="411" font-size="9" fill="#555555" text-anchor="middle">로직만 공유</text>

  <!-- 6층 툴체인 -->
  <rect x="30" y="458" width="840" height="112" rx="14" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2.5"/>
  <text x="52" y="484" font-size="14" font-weight="800" fill="#B91C1C">6층 · 툴체인 — 어느 길로 오든 반드시 통과하는 관문</text>
  <rect x="52" y="496" width="390" height="58" rx="10" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="247" y="518" font-size="11.5" font-weight="800" fill="#002C5F" text-anchor="middle">Android SDK · Gradle → .aab / .apk</text>
  <text x="247" y="538" font-size="9.5" fill="#555555" text-anchor="middle">윈도우·맥·리눅스 어디서나 빌드 가능</text>
  <rect x="456" y="496" width="390" height="58" rx="10" fill="#FFFFFF" stroke="#B91C1C" stroke-width="2.5"/>
  <text x="651" y="518" font-size="11.5" font-weight="800" fill="#B91C1C" text-anchor="middle">Xcode · iOS SDK → .ipa (서명 필수)</text>
  <text x="651" y="538" font-size="9.5" fill="#555555" text-anchor="middle">맥에서만 — Flutter·RN으로 짜도 이 관문은 못 피한다</text>

  <!-- 하단 -->
  <rect x="30" y="586" width="840" height="58" rx="12" fill="#0D1B2E"/>
  <text x="450" y="610" font-size="12" font-weight="800" fill="#FFF" text-anchor="middle">"Kotlin이냐 Flutter냐"는 사실 층이 다른 비교 — 정확한 질문은 "Kotlin+Compose냐, Dart+Flutter냐"다</text>
  <text x="450" y="632" font-size="10.5" fill="#AAB9CF" text-anchor="middle">언어는 고를 수 있지만 6층 툴체인은 플랫폼이 정한다 — 「애플 앱 개발의 지도」의 "언어는 자유, 툴체인은 의무"</text>
</svg>
