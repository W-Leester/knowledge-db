<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="asa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#003F8A"/>
    </marker>
  </defs>
  <rect width="900" height="640" fill="#FAF7F2"/>
  <text x="450" y="34" font-size="20" font-weight="800" fill="#002C5F" text-anchor="middle">설정 화면 하나가 의무의 대부분을 담는다</text>
  <text x="450" y="58" font-size="13" fill="#666666" text-anchor="middle">이 골격을 첫 버전부터 만들어두면 — 심사 항목이 자동으로 커버되고, 이후엔 채우기만 하면 된다</text>

  <!-- 폰 프레임 -->
  <rect x="70" y="84" width="300" height="520" rx="28" fill="#FFFFFF" stroke="#555555" stroke-width="3"/>
  <rect x="180" y="98" width="80" height="10" rx="5" fill="#D5CFBF"/>
  <text x="220" y="140" font-size="15" font-weight="800" fill="#1A1A1A" text-anchor="middle">⚙️ 설정</text>

  <!-- 계정 그룹 -->
  <rect x="92" y="158" width="256" height="96" rx="10" fill="#F2EDE4"/>
  <text x="106" y="180" font-size="10" font-weight="800" fill="#8A8478">계정</text>
  <text x="106" y="200" font-size="11" fill="#1A1A1A">프로필 · 구독 관리</text>
  <text x="106" y="220" font-size="11" fill="#1A1A1A">로그아웃</text>
  <text x="106" y="242" font-size="11" font-weight="700" fill="#DC2626">계정 삭제</text>

  <!-- 알림 그룹 -->
  <rect x="92" y="264" width="256" height="72" rx="10" fill="#F2EDE4"/>
  <text x="106" y="286" font-size="10" font-weight="800" fill="#8A8478">알림</text>
  <text x="106" y="306" font-size="11" fill="#1A1A1A">서비스 알림 (필수)</text>
  <text x="106" y="326" font-size="11" fill="#1A1A1A">마케팅 알림 (별도 동의)</text>

  <!-- 지원 그룹 -->
  <rect x="92" y="346" width="256" height="72" rx="10" fill="#F2EDE4"/>
  <text x="106" y="368" font-size="10" font-weight="800" fill="#8A8478">지원</text>
  <text x="106" y="388" font-size="11" fill="#1A1A1A">문의하기 · FAQ</text>
  <text x="106" y="408" font-size="11" fill="#1A1A1A">오류 신고 (로그 첨부)</text>

  <!-- 법적 고지 그룹 -->
  <rect x="92" y="428" width="256" height="96" rx="10" fill="#FEE2E2"/>
  <text x="106" y="450" font-size="10" font-weight="800" fill="#991B1B">법적 고지</text>
  <text x="106" y="470" font-size="11" fill="#1A1A1A">개인정보처리방침 · 이용약관</text>
  <text x="106" y="490" font-size="11" fill="#1A1A1A">오픈소스 라이선스</text>
  <text x="106" y="512" font-size="11" fill="#1A1A1A">사업자 정보 (유료 시)</text>

  <!-- 정보 그룹 -->
  <rect x="92" y="534" width="256" height="56" rx="10" fill="#E8EEF7"/>
  <text x="106" y="556" font-size="10" font-weight="800" fill="#3568B0">정보</text>
  <text x="106" y="576" font-size="11" fill="#1A1A1A">버전 1.2.3 (45) · What's New</text>

  <!-- 우측 주석들 -->
  <line x1="348" y1="240" x2="430" y2="150" stroke="#DC2626" stroke-width="2" marker-end="url(#asa)"/>
  <rect x="434" y="112" width="436 " height="72" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="452" y="136" font-size="11.5" font-weight="800" fill="#DC2626">계정 삭제 — 1층 의무 (양대 스토어 공통)</text>
  <text x="452" y="156" font-size="10" fill="#555555">계정을 만들 수 있으면, 앱 안에서 지울 수도 있어야 한다.</text>
  <text x="452" y="174" font-size="10" fill="#555555">"이메일 주시면 지워드려요"로는 부족 — 심사 거절 사유</text>

  <line x1="348" y1="300" x2="430" y2="252" stroke="#E8962A" stroke-width="2" marker-end="url(#asa)"/>
  <rect x="434" y="214" width="436" height="72" rx="12" fill="#FEF3E2" stroke="#E8962A" stroke-width="2"/>
  <text x="452" y="238" font-size="11.5" font-weight="800" fill="#B45309">알림 분리 — 필수/마케팅을 따로</text>
  <text x="452" y="258" font-size="10" fill="#555555">전부 켜기/끄기만 있으면 마케팅 끄려는 사용자가 필수 알림까지 잃는다.</text>
  <text x="452" y="276" font-size="10" fill="#555555">한국: 광고성 푸시는 별도 사전 동의 + 야간 발송 제한 (개략 — 확인 필요)</text>

  <line x1="348" y1="476" x2="430" y2="372" stroke="#991B1B" stroke-width="2" marker-end="url(#asa)"/>
  <rect x="434" y="316" width="436" height="100" rx="12" fill="#FEE2E2" stroke="#991B1B" stroke-width="2"/>
  <text x="452" y="340" font-size="11.5" font-weight="800" fill="#991B1B">법적 고지 4종 — 1층 의무의 집합소</text>
  <text x="452" y="360" font-size="10" fill="#555555">· 개인정보처리방침: 스토어 등록 링크와 같은 내용이 앱 안에도</text>
  <text x="452" y="378" font-size="10" fill="#555555">· 오픈소스 라이선스: THIRD-PARTY-NOTICES가 그대로 이 화면의 원고</text>
  <text x="452" y="396" font-size="10" fill="#555555">  (「오픈소스 라이선스」 §4 — MIT의 고지 의무가 앱에선 여기서 이행된다)</text>
  <text x="452" y="410" font-size="9.5" fill="#666666">· 약관 개정 시 "동의 다시 받기" — 문서에 버전을 달아둘 것</text>

  <line x1="348" y1="562" x2="430" y2="486" stroke="#3568B0" stroke-width="2" marker-end="url(#asa)"/>
  <rect x="434" y="446" width="436" height="76" rx="12" fill="#E8EEF7" stroke="#3568B0" stroke-width="2"/>
  <text x="452" y="470" font-size="11.5" font-weight="800" fill="#3568B0">버전 표시 — 2층의 관문</text>
  <text x="452" y="490" font-size="10" fill="#555555">CS의 첫 질문이 "버전이 뭐예요?" — 1.2.3 (빌드 45)처럼 빌드 번호까지.</text>
  <text x="452" y="508" font-size="10" fill="#555555">여기에 "업데이트 확인" 버튼을 같이 두면 강제 업데이트(§3)와 한 세트</text>

  <rect x="434" y="542" width="436" height="62" rx="12" fill="#0D1B2E"/>
  <text x="452" y="566" font-size="11.5" font-weight="800" fill="#FFF">요령: 첫 버전에서 화면 골격만 만들고 내용은 링크로</text>
  <text x="452" y="586" font-size="10" fill="#AAB9CF">방침·약관은 웹 URL을 웹뷰로 여는 방식이면 — 개정 때 앱 업데이트가 불필요하다</text>
</svg>
