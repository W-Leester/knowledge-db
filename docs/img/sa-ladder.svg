<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="sla" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#003F8A"/>
    </marker>
  </defs>
  <rect width="900" height="640" fill="#FAF7F2"/>
  <text x="450" y="34" font-size="20" font-weight="800" fill="#002C5F" text-anchor="middle">책임의 사다리 — IaaS · PaaS · BaaS · SaaS</text>
  <text x="450" y="58" font-size="13" fill="#666666" text-anchor="middle">아래로 갈수록 "만드는 사람", 위로 갈수록 "쓰는 사람" — SaaS 제작자는 아래 층들을 조립해 위 층을 판다</text>

  <!-- 층들 -->
  <rect x="60" y="84" width="560" height="112" rx="14" fill="#E6F7F1" stroke="#0F766E" stroke-width="3"/>
  <text x="82" y="114" font-size="15" font-weight="800" fill="#0F766E">SaaS — 완성품을 빌린다</text>
  <text x="82" y="138" font-size="11" fill="#555555">Notion · Slack · Figma — 고객은 계정 만들고 쓰기만 한다</text>
  <text x="82" y="158" font-size="11" fill="#555555">고객이 신경 쓸 것: <tspan font-weight="700">없음</tspan> (브라우저만 있으면 됨)</text>
  <text x="82" y="181" font-size="10.5" font-weight="700" fill="#0F766E">← 내가 "파는" 층: 이 문서의 주인공</text>

  <rect x="60" y="208" width="560" height="104" rx="14" fill="#FEF3E2" stroke="#E8962A" stroke-width="2.5"/>
  <text x="82" y="238" font-size="15" font-weight="800" fill="#B45309">BaaS — 백엔드 부품을 빌린다</text>
  <text x="82" y="262" font-size="11" fill="#555555">Supabase · Firebase — 인증·DB·스토리지·API가 부품으로 제공</text>
  <text x="82" y="282" font-size="11" fill="#555555">내가 신경 쓸 것: 내 앱 코드 + 부품 조립 (RLS·키 관리)</text>
  <text x="82" y="301" font-size="10.5" font-weight="700" fill="#B45309">← 「데이터베이스」 §7·§9에서 배운 그 층</text>

  <rect x="60" y="324" width="560" height="104" rx="14" fill="#E8EEF7" stroke="#1A5CB5" stroke-width="2.5"/>
  <text x="82" y="354" font-size="15" font-weight="800" fill="#002C5F">PaaS — 실행 환경을 빌린다</text>
  <text x="82" y="378" font-size="11" fill="#555555">Vercel · Railway — 코드만 push하면 서버·확장은 남이 한다</text>
  <text x="82" y="398" font-size="11" fill="#555555">내가 신경 쓸 것: 코드 전부 (백엔드 로직 포함)</text>
  <text x="82" y="417" font-size="10.5" font-weight="700" fill="#1A5CB5">← "push = 배포" — 이 지식 베이스와 같은 리듬</text>

  <rect x="60" y="440" width="560" height="104" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="82" y="470" font-size="15" font-weight="800" fill="#DC2626">IaaS — 서버(빈 방)를 빌린다</text>
  <text x="82" y="494" font-size="11" fill="#555555">AWS EC2 · 가상 서버 — OS 설치부터 보안 패치까지 전부 내 일</text>
  <text x="82" y="514" font-size="11" fill="#555555">내가 신경 쓸 것: OS·미들웨어·DB·백업·확장·장애 대응 전부</text>
  <text x="82" y="533" font-size="10.5" font-weight="700" fill="#DC2626">← §9의 "직접 정비하는 트럭"이 사는 층</text>

  <!-- 오른쪽 화살표: 책임 방향 -->
  <line x1="660" y1="120" x2="660" y2="520" stroke="#8A8478" stroke-width="2.5" marker-end="url(#sla)"/>
  <text x="682" y="140" font-size="11.5" font-weight="800" fill="#0F766E">내 책임 적음</text>
  <text x="682" y="160" font-size="10" fill="#666666">(대신 자유도·마진 낮음)</text>
  <text x="682" y="500" font-size="11.5" font-weight="800" fill="#DC2626">내 책임 전부</text>
  <text x="682" y="520" font-size="10" fill="#666666">(대신 자유도 최대)</text>

  <text x="770" y="300" font-size="11" fill="#555555" text-anchor="middle">비유: 호텔(SaaS)</text>
  <text x="770" y="320" font-size="11" fill="#555555" text-anchor="middle">→ 풀옵션 원룸(BaaS)</text>
  <text x="770" y="340" font-size="11" fill="#555555" text-anchor="middle">→ 빈 오피스텔(PaaS)</text>
  <text x="770" y="360" font-size="11" fill="#555555" text-anchor="middle">→ 맨땅+골조(IaaS)</text>

  <!-- 하단 -->
  <rect x="30" y="566" width="840" height="56" rx="12" fill="#0D1B2E"/>
  <text x="450" y="592" font-size="12.5" font-weight="800" fill="#FFF" text-anchor="middle">SaaS 제작자의 표준 전략: PaaS(Vercel) + BaaS(Supabase)를 조립해서 → SaaS를 판다</text>
  <text x="450" y="612" font-size="11" fill="#AAB9CF" text-anchor="middle">아래 층을 직접 지을수록 마진은 늘지만 책임도 는다 — 1인 개발은 위쪽 조립에서 시작하는 것이 정석</text>
</svg>
