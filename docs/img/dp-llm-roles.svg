<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="dra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#003F8A"/>
    </marker>
  </defs>
  <rect width="900" height="600" fill="#FAF7F2"/>
  <text x="450" y="34" font-size="20" font-weight="800" fill="#002C5F" text-anchor="middle">LLM은 "코드 생성 버튼"이 아니다 — 개발 전 과정의 8가지 역할</text>
  <text x="450" y="58" font-size="13" fill="#666666" text-anchor="middle">생성은 여덟 중 하나일 뿐 — 나머지 일곱이 실은 더 자주 쓰인다</text>

  <!-- 8 역할 그리드 -->
  <rect x="30" y="80" width="205" height="108" rx="12" fill="#E8EEF7" stroke="#1A5CB5" stroke-width="2"/>
  <text x="132" y="108" font-size="12.5" font-weight="800" fill="#002C5F" text-anchor="middle">🗣 설계 상담역</text>
  <text x="132" y="130" font-size="10" fill="#555555" text-anchor="middle">옵션 비교·트레이드오프 설명</text>
  <text x="132" y="148" font-size="10" fill="#555555" text-anchor="middle">"A안 vs B안, 내 상황엔?"</text>
  <text x="132" y="172" font-size="9" fill="#666666" text-anchor="middle">단계 ①② 주역</text>

  <rect x="248" y="80" width="205" height="108" rx="12" fill="#FEF3E2" stroke="#E8962A" stroke-width="2.5"/>
  <text x="350" y="108" font-size="12.5" font-weight="800" fill="#B45309" text-anchor="middle">⌨️ 코드 생성기</text>
  <text x="350" y="130" font-size="10" fill="#555555" text-anchor="middle">스펙 → 구현. 가장 유명하지만</text>
  <text x="350" y="148" font-size="10" fill="#555555" text-anchor="middle">전체 시간의 일부일 뿐</text>
  <text x="350" y="172" font-size="9" fill="#666666" text-anchor="middle">단계 ④-2</text>

  <rect x="466" y="80" width="205" height="108" rx="12" fill="#E6F7F1" stroke="#00AA6C" stroke-width="2"/>
  <text x="568" y="108" font-size="12.5" font-weight="800" fill="#065F46" text-anchor="middle">📖 독해기</text>
  <text x="568" y="130" font-size="10" fill="#555555" text-anchor="middle">남의 코드·레거시를 설명시킴</text>
  <text x="568" y="148" font-size="10" fill="#555555" text-anchor="middle">"이 함수 뭐 하는 거야?"</text>
  <text x="568" y="172" font-size="9" fill="#666666" text-anchor="middle">기존 코드 위에서 일할 때 필수</text>

  <rect x="684" y="80" width="186" height="108" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="777" y="108" font-size="12.5" font-weight="800" fill="#DC2626" text-anchor="middle">🐛 디버거</text>
  <text x="777" y="130" font-size="10" fill="#555555" text-anchor="middle">에러 로그 해석 → 원인 가설</text>
  <text x="777" y="148" font-size="10" fill="#555555" text-anchor="middle">→ 수정 제안·적용</text>
  <text x="777" y="172" font-size="9" fill="#666666" text-anchor="middle">④-3의 자동 수정 루프</text>

  <rect x="30" y="204" width="205" height="108" rx="12" fill="#F3E8FF" stroke="#6B21A8" stroke-width="2"/>
  <text x="132" y="232" font-size="12.5" font-weight="800" fill="#6B21A8" text-anchor="middle">⚖️ 리뷰어 (1차)</text>
  <text x="132" y="254" font-size="10" fill="#555555" text-anchor="middle">diff를 다른 눈으로 검토</text>
  <text x="132" y="272" font-size="10" fill="#555555" text-anchor="middle">— LLM-as-a-Judge의 자리</text>
  <text x="132" y="296" font-size="9" fill="#666666" text-anchor="middle">④-4 · 사람 리뷰의 전처리</text>

  <rect x="248" y="204" width="205" height="108" rx="12" fill="#E6F7F1" stroke="#00AA6C" stroke-width="2"/>
  <text x="350" y="232" font-size="12.5" font-weight="800" fill="#065F46" text-anchor="middle">🧪 테스트 작성자</text>
  <text x="350" y="254" font-size="10" fill="#555555" text-anchor="middle">수용 기준 → 테스트 코드</text>
  <text x="350" y="272" font-size="10" fill="#555555" text-anchor="middle">— 과녁을 만드는 역할</text>
  <text x="350" y="296" font-size="9" fill="#666666" text-anchor="middle">④-1 — 생성보다 먼저</text>

  <rect x="466" y="204" width="205" height="108" rx="12" fill="#E8EEF7" stroke="#1A5CB5" stroke-width="2"/>
  <text x="568" y="232" font-size="12.5" font-weight="800" fill="#002C5F" text-anchor="middle">📝 문서화·정리</text>
  <text x="568" y="254" font-size="10" fill="#555555" text-anchor="middle">README·주석·커밋 메시지</text>
  <text x="568" y="272" font-size="10" fill="#555555" text-anchor="middle">리팩토링 — 미루던 일들</text>
  <text x="568" y="296" font-size="9" fill="#666666" text-anchor="middle">단계 ⑤ — 맡기기 가장 좋은 일</text>

  <rect x="684" y="204" width="186" height="108" rx="12" fill="#FEF3E2" stroke="#E8962A" stroke-width="2"/>
  <text x="777" y="232" font-size="12.5" font-weight="800" fill="#B45309" text-anchor="middle">🎓 과외 교사</text>
  <text x="777" y="254" font-size="10" fill="#555555" text-anchor="middle">새 스택·개념을 내 코드로</text>
  <text x="777" y="272" font-size="10" fill="#555555" text-anchor="middle">설명받으며 배움</text>
  <text x="777" y="296" font-size="9" fill="#666666" text-anchor="middle">전 단계에 걸침</text>

  <!-- 내부 과정 -->
  <text x="450" y="356" font-size="15" font-weight="800" fill="#002C5F" text-anchor="middle">"코드 짜줘" 한 마디의 내부 — 에이전트가 실제로 거치는 과정</text>
  <rect x="30" y="374" width="150" height="70" rx="10" fill="#FFFFFF" stroke="#B5AFA5" stroke-width="1.5"/>
  <text x="105" y="400" font-size="11" font-weight="800" fill="#002C5F" text-anchor="middle">① 컨텍스트 수집</text>
  <text x="105" y="420" font-size="9" fill="#666666" text-anchor="middle">파일 읽기·검색·구조 파악</text>
  <text x="105" y="434" font-size="9" fill="#666666" text-anchor="middle">(도구 호출 여러 번)</text>
  <line x1="180" y1="409" x2="202" y2="409" stroke="#003F8A" stroke-width="2" marker-end="url(#dra)"/>
  <rect x="206" y="374" width="150" height="70" rx="10" fill="#FFFFFF" stroke="#B5AFA5" stroke-width="1.5"/>
  <text x="281" y="400" font-size="11" font-weight="800" fill="#002C5F" text-anchor="middle">② 계획</text>
  <text x="281" y="420" font-size="9" fill="#666666" text-anchor="middle">수정할 파일·순서 결정</text>
  <line x1="356" y1="409" x2="378" y2="409" stroke="#003F8A" stroke-width="2" marker-end="url(#dra)"/>
  <rect x="382" y="374" width="150" height="70" rx="10" fill="#FFFFFF" stroke="#B5AFA5" stroke-width="1.5"/>
  <text x="457" y="400" font-size="11" font-weight="800" fill="#002C5F" text-anchor="middle">③ 편집</text>
  <text x="457" y="420" font-size="9" fill="#666666" text-anchor="middle">파일 수정 (diff 단위)</text>
  <line x1="532" y1="409" x2="554" y2="409" stroke="#003F8A" stroke-width="2" marker-end="url(#dra)"/>
  <rect x="558" y="374" width="150" height="70" rx="10" fill="#FFFFFF" stroke="#B5AFA5" stroke-width="1.5"/>
  <text x="633" y="400" font-size="11" font-weight="800" fill="#002C5F" text-anchor="middle">④ 실행·확인</text>
  <text x="633" y="420" font-size="9" fill="#666666" text-anchor="middle">테스트·빌드 돌려보기</text>
  <line x1="708" y1="409" x2="730" y2="409" stroke="#003F8A" stroke-width="2" marker-end="url(#dra)"/>
  <rect x="734" y="374" width="136" height="70" rx="10" fill="#0D1B2E"/>
  <text x="802" y="400" font-size="11" font-weight="800" fill="#7FD1A8" text-anchor="middle">⑤ 보고 or 반복</text>
  <text x="802" y="420" font-size="9" fill="#AAB9CF" text-anchor="middle">실패면 ①로 돌아감</text>

  <text x="450" y="474" font-size="11" fill="#666666" text-anchor="middle">이 다섯 걸음이 곧 에이전트 루프 — 「Claude Code 내부 해부」 §2·「로컬 LLM 에이전트」 §2에서 해부한 그 구조다</text>

  <!-- 하단 -->
  <rect x="30" y="496" width="840" height="84" rx="12" fill="#E8EEF7" stroke="#1A5CB5" stroke-width="2"/>
  <text x="450" y="524" font-size="13" font-weight="800" fill="#002C5F" text-anchor="middle">실무 감각: 역할마다 "믿는 정도"를 다르게</text>
  <text x="450" y="548" font-size="11.5" fill="#555555" text-anchor="middle">문서화·테스트 작성·독해는 크게 믿고 맡겨도 되고 · 생성·디버깅은 검증을 끼고 · 설계 상담은 "의견"으로 듣고 결정은 내가</text>
  <text x="450" y="568" font-size="10.5" fill="#666666" text-anchor="middle">여덟 역할 전부에서 잘못되면 비용이 큰 순서대로 사람의 눈이 배치된다 — §4의 리뷰 피라미드로 이어진다</text>
</svg>
