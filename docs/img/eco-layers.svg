<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="ela" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#003F8A"/>
    </marker>
  </defs>
  <rect width="900" height="680" fill="#FAF7F2"/>
  <text x="450" y="34" font-size="20" font-weight="800" fill="#002C5F" text-anchor="middle">6층 명함 — "개발환경"이라는 한 단어 안에 있는 것들</text>
  <text x="450" y="58" font-size="13" fill="#666666" text-anchor="middle">새 이름을 만나면 먼저 묻는다: "이건 몇 층이지?" — 오른쪽은 파이썬·JS 세계의 실제 거주자들</text>

  <!-- 층 스택 -->
  <rect x="30" y="84" width="560" height="76" rx="12" fill="#E8EEF7" stroke="#1A5CB5" stroke-width="2.5"/>
  <text x="52" y="112" font-size="14" font-weight="800" fill="#002C5F">1층 · 언어 (문법)</text>
  <text x="52" y="134" font-size="11" fill="#555555">컴퓨터에게 말하는 "말" — 문법 규칙의 집합. 실체는 명세서(문서)다</text>
  <text x="52" y="151" font-size="10" fill="#666666">파일로 치면: .py .js .rs 안에 적힌 그 문장들</text>
  <rect x="610" y="92" width="260" height="60" rx="10" fill="#FFFFFF" stroke="#1A5CB5" stroke-width="1.2"/>
  <text x="740" y="115" font-size="10.5" font-weight="700" fill="#1A5CB5" text-anchor="middle">Python · JavaScript · TypeScript</text>
  <text x="740" y="134" font-size="9.5" fill="#666666" text-anchor="middle">Rust · Go · Swift · C++ …</text>

  <rect x="30" y="168" width="560" height="76" rx="12" fill="#FEF3E2" stroke="#E8962A" stroke-width="2.5"/>
  <text x="52" y="196" font-size="14" font-weight="800" fill="#B45309">2층 · 런타임 (실행기)</text>
  <text x="52" y="218" font-size="11" fill="#555555">그 말을 알아듣고 실행하는 <tspan font-weight="700">프로그램</tspan> — 언어와 별개의 상품</text>
  <text x="52" y="235" font-size="10" fill="#666666">한 언어에 무대가 여럿일 수 있다 (JS: 브라우저·Node·Bun / Python: CPython·PyPy)</text>
  <rect x="610" y="176" width="260" height="60" rx="10" fill="#FFFFFF" stroke="#E8962A" stroke-width="1.2"/>
  <text x="740" y="199" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="middle">CPython(python) · Node.js · Bun</text>
  <text x="740" y="218" font-size="9.5" fill="#666666" text-anchor="middle">브라우저(V8) · JVM · CLR(.NET)</text>

  <rect x="30" y="252" width="560" height="76" rx="12" fill="#E6F7F1" stroke="#00AA6C" stroke-width="2.5"/>
  <text x="52" y="280" font-size="14" font-weight="800" fill="#065F46">3층 · 패키지 매니저 (배달부)</text>
  <text x="52" y="302" font-size="11" fill="#555555">남의 코드를 <tspan font-weight="700">가져오고·버전 관리하는 도구</tspan> — 창고(4층)와는 다른 것</text>
  <text x="52" y="319" font-size="10" fill="#666666">npm install / pip install 을 치는 그 프로그램</text>
  <rect x="610" y="260" width="260" height="60" rx="10" fill="#FFFFFF" stroke="#00AA6C" stroke-width="1.2"/>
  <text x="740" y="283" font-size="10.5" font-weight="700" fill="#065F46" text-anchor="middle">pip · uv · npm · pnpm · yarn</text>
  <text x="740" y="302" font-size="9.5" fill="#666666" text-anchor="middle">cargo(Rust) · go · Maven·Gradle</text>

  <rect x="30" y="336" width="560" height="76" rx="12" fill="#F3E8FF" stroke="#6B21A8" stroke-width="2.5"/>
  <text x="52" y="364" font-size="14" font-weight="800" fill="#6B21A8">4층 · 레지스트리 (창고)</text>
  <text x="52" y="386" font-size="11" fill="#555555">전 세계 패키지가 모여 있는 <tspan font-weight="700">온라인 저장소</tspan> — 배달부가 다녀오는 곳</text>
  <text x="52" y="403" font-size="10" fill="#666666">"npm"이 헷갈리는 이유: 도구(3층) 이름이자 창고(4층) 이름</text>
  <rect x="610" y="344" width="260" height="60" rx="10" fill="#FFFFFF" stroke="#6B21A8" stroke-width="1.2"/>
  <text x="740" y="367" font-size="10.5" font-weight="700" fill="#6B21A8" text-anchor="middle">PyPI · npm 레지스트리 · crates.io</text>
  <text x="740" y="386" font-size="9.5" fill="#666666" text-anchor="middle">Maven Central · NuGet · HuggingFace도 4층</text>

  <rect x="30" y="420" width="560" height="76" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="52" y="448" font-size="14" font-weight="800" fill="#DC2626">5층 · 패키지 (코드 뭉치 — 라이브러리·프레임워크)</text>
  <text x="52" y="470" font-size="11" fill="#555555">배달받은 <tspan font-weight="700">남의 코드 그 자체</tspan> — 도구상자(라이브러리)거나 뼈대(프레임워크)</text>
  <text x="52" y="487" font-size="10" fill="#666666">React는 "언어"가 아니라 이 층의 거주자 — JS로 쓰인 코드 뭉치</text>
  <rect x="610" y="428" width="260" height="60" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2"/>
  <text x="740" y="451" font-size="10.5" font-weight="700" fill="#DC2626" text-anchor="middle">React · Express · FastAPI</text>
  <text x="740" y="470" font-size="9.5" fill="#666666" text-anchor="middle">requests · PyTorch · serde · Spring</text>

  <rect x="30" y="504" width="560" height="76" rx="12" fill="#E8EEF7" stroke="#3568B0" stroke-width="2.5"/>
  <text x="52" y="532" font-size="14" font-weight="800" fill="#3568B0">6층 · 빌드 도구 (변환기)</text>
  <text x="52" y="554" font-size="11" fill="#555555">코드를 배포 표적에 맞게 <tspan font-weight="700">변환·묶음·압축</tspan> — 실행 전의 공장</text>
  <text x="52" y="571" font-size="10" fill="#666666">JS 세계가 유독 시끄러운 층 (브라우저라는 표적 때문) · 파이썬엔 거의 없음</text>
  <rect x="610" y="512" width="260" height="60" rx="10" fill="#FFFFFF" stroke="#3568B0" stroke-width="1.2"/>
  <text x="740" y="535" font-size="10.5" font-weight="700" fill="#3568B0" text-anchor="middle">Vite · esbuild · tsc · Babel</text>
  <text x="740" y="554" font-size="9.5" fill="#666666" text-anchor="middle">rustc·gcc(컴파일 언어는 이 층이 본체)</text>

  <!-- 터미널 창구 -->
  <rect x="30" y="600" width="840" height="64" rx="12" fill="#0D1B2E"/>
  <text x="52" y="628" font-size="13.5" font-weight="800" fill="#FFF">⌨️ 그리고 표 밖의 터미널(CMD·셸) — 층이 아니라 "창구"다</text>
  <text x="52" y="650" font-size="11" fill="#AAB9CF">python·node·npm·vite… 여섯 층의 누구든 이름을 불러 깨우는 인터페이스일 뿐 — 스스로는 코드를 못 읽는다 (식당 카운터와 요리사)</text>
</svg>
