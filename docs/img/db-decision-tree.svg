<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 790" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="dta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#003F8A"/>
    </marker>
    <marker id="dtg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00AA6C"/>
    </marker>
    <marker id="dtr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect width="900" height="790" fill="#FAF7F2"/>
  <text x="450" y="34" font-size="20" font-weight="800" fill="#002C5F" text-anchor="middle">결정 트리 — 위에서부터 답하면 DB가 정해진다</text>
  <text x="450" y="58" font-size="13" fill="#666666" text-anchor="middle">첫 갈림길은 "민감 데이터", 마지막 갈림길은 "관계형이냐 모바일이냐"</text>

  <!-- Q1 -->
  <rect x="290" y="80" width="320" height="54" rx="27" fill="#0D1B2E"/>
  <text x="450" y="103" font-size="13" font-weight="800" fill="#FFF" text-anchor="middle">Q1. 개인정보·결제 정보를 다루나?</text>
  <text x="450" y="122" font-size="10" fill="#AAB9CF" text-anchor="middle">회원 이메일·전화번호·주소·카드 등</text>

  <line x1="290" y1="107" x2="200" y2="107" stroke="#DC2626" stroke-width="2.5"/>
  <line x1="200" y1="107" x2="200" y2="152" stroke="#DC2626" stroke-width="2.5" marker-end="url(#dtr)"/>
  <text x="243" y="98" font-size="11" font-weight="800" fill="#DC2626" text-anchor="middle">예</text>
  <rect x="60" y="156" width="280" height="56" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="200" y="180" font-size="12" font-weight="800" fill="#DC2626" text-anchor="middle">🚫 구글 시트·노션은 여기서 탈락</text>
  <text x="200" y="199" font-size="10" fill="#555555" text-anchor="middle">→ Q2로 (제대로 된 DB 중에서 고른다)</text>

  <line x1="450" y1="134" x2="450" y2="238" stroke="#003F8A" stroke-width="2.5" marker-end="url(#dta)"/>
  <text x="472" y="160" font-size="11" font-weight="800" fill="#065F46">아니오</text>
  <line x1="200" y1="212" x2="200" y2="238" stroke="#003F8A" stroke-width="2.5"/>
  <line x1="200" y1="238" x2="290" y2="238" stroke="#003F8A" stroke-width="2.5" marker-end="url(#dta)"/>

  <!-- Q2 -->
  <rect x="294" y="242" width="312" height="54" rx="27" fill="#0D1B2E"/>
  <text x="450" y="265" font-size="13" font-weight="800" fill="#FFF" text-anchor="middle">Q2. 여러 사람이 동시에 쓰나?</text>
  <text x="450" y="284" font-size="10" fill="#AAB9CF" text-anchor="middle">회원가입·로그인이 필요한가와 사실상 같은 질문</text>

  <!-- 아니오 → 왼쪽 -->
  <line x1="294" y1="269" x2="180" y2="269" stroke="#00AA6C" stroke-width="2.5"/>
  <line x1="180" y1="269" x2="180" y2="322" stroke="#00AA6C" stroke-width="2.5" marker-end="url(#dtg)"/>
  <text x="237" y="260" font-size="11" font-weight="800" fill="#065F46" text-anchor="middle">아니오 (혼자)</text>

  <rect x="40" y="326" width="280" height="52" rx="26" fill="#0D1B2E"/>
  <text x="180" y="348" font-size="12.5" font-weight="800" fill="#FFF" text-anchor="middle">Q3. 데이터가 날아가면?</text>
  <text x="180" y="366" font-size="10" fill="#AAB9CF" text-anchor="middle">다시 만들 수 있나, 치명적인가</text>

  <line x1="110" y1="378" x2="110" y2="408" stroke="#00AA6C" stroke-width="2.2" marker-end="url(#dtg)"/>
  <text x="70" y="398" font-size="10" font-weight="700" fill="#065F46">재생성 가능</text>
  <rect x="40" y="412" width="130" height="72" rx="12" fill="#E6F7F1" stroke="#00AA6C" stroke-width="2"/>
  <text x="105" y="436" font-size="12" font-weight="800" fill="#065F46" text-anchor="middle">구글 시트</text>
  <text x="105" y="454" font-size="9.5" fill="#555555" text-anchor="middle">가장 빠른 시작</text>
  <text x="105" y="472" font-size="9.5" fill="#666666" text-anchor="middle">명단·목록·검증용</text>

  <line x1="250" y1="378" x2="250" y2="408" stroke="#1A5CB5" stroke-width="2.2" marker-end="url(#dta)"/>
  <text x="288" y="398" font-size="10" font-weight="700" fill="#1A5CB5">중요하다</text>
  <rect x="182" y="412" width="138" height="72" rx="12" fill="#E8EEF7" stroke="#1A5CB5" stroke-width="2.5"/>
  <text x="251" y="436" font-size="12" font-weight="800" fill="#002C5F" text-anchor="middle">SQLite ★</text>
  <text x="251" y="454" font-size="9.5" fill="#555555" text-anchor="middle">파일 하나 = DB</text>
  <text x="251" y="472" font-size="9.5" fill="#666666" text-anchor="middle">개인 앱·도구·로컬</text>

  <!-- 예 → 오른쪽 -->
  <line x1="606" y1="269" x2="730" y2="269" stroke="#003F8A" stroke-width="2.5"/>
  <line x1="730" y1="269" x2="730" y2="322" stroke="#003F8A" stroke-width="2.5" marker-end="url(#dta)"/>
  <text x="668" y="260" font-size="11" font-weight="800" fill="#B45309" text-anchor="middle">예 (여럿)</text>

  <rect x="590" y="326" width="280" height="52" rx="26" fill="#0D1B2E"/>
  <text x="730" y="348" font-size="12.5" font-weight="800" fill="#FFF" text-anchor="middle">Q4. 주 목적이 분석인가?</text>
  <text x="730" y="366" font-size="10" fill="#AAB9CF" text-anchor="middle">서비스 운영 vs 데이터 들여다보기</text>

  <line x1="838" y1="378" x2="838" y2="408" stroke="#0F766E" stroke-width="2.2" marker-end="url(#dtg)"/>
  <text x="866" y="398" font-size="10" font-weight="700" fill="#0F766E" text-anchor="end">분석</text>
  <rect x="762" y="412" width="108" height="72" rx="12" fill="#E6F7F1" stroke="#0F766E" stroke-width="2"/>
  <text x="816" y="436" font-size="12" font-weight="800" fill="#0F766E" text-anchor="middle">DuckDB</text>
  <text x="816" y="454" font-size="9.5" fill="#555555" text-anchor="middle">CSV·로그 분석</text>
  <text x="816" y="472" font-size="9.5" fill="#666666" text-anchor="middle">메인 DB 아님</text>

  <line x1="640" y1="378" x2="640" y2="408" stroke="#003F8A" stroke-width="2.2" marker-end="url(#dta)"/>
  <text x="600" y="398" font-size="10" font-weight="700" fill="#B45309">운영</text>

  <!-- Q5 (신설) -->
  <rect x="360" y="412" width="380" height="56" rx="28" fill="#0D1B2E"/>
  <text x="550" y="435" font-size="12.5" font-weight="800" fill="#FFF" text-anchor="middle">Q5. 데이터에 관계(JOIN)·복잡한 조회가 필요한가?</text>
  <text x="550" y="455" font-size="10" fill="#AAB9CF" text-anchor="middle">주문↔상품↔사용자처럼 얽히는가 · 통계·필터가 중요한가</text>

  <line x1="450" y1="468" x2="450" y2="500" stroke="#003F8A" stroke-width="2.2" marker-end="url(#dta)"/>
  <text x="410" y="490" font-size="10" font-weight="700" fill="#B45309">예 · 잘 모르겠다</text>
  <rect x="330" y="504" width="212" height="86" rx="12" fill="#FEF3E2" stroke="#E8962A" stroke-width="3"/>
  <text x="436" y="528" font-size="12.5" font-weight="800" fill="#B45309" text-anchor="middle">Supabase ★ 기본값</text>
  <text x="436" y="548" font-size="9.5" fill="#555555" text-anchor="middle">Postgres + 인증 + API + 실시간</text>
  <text x="436" y="566" font-size="9.5" fill="#555555" text-anchor="middle">SQL·관계 설계 자유 · 이사도 쉽다</text>
  <text x="436" y="582" font-size="9.5" fill="#666666" text-anchor="middle">→ RLS·키 학습 필요 (§9-D)</text>

  <line x1="650" y1="468" x2="650" y2="500" stroke="#DC2626" stroke-width="2.2" marker-end="url(#dtr)"/>
  <text x="700" y="490" font-size="10" font-weight="700" fill="#DC2626">아니오 + 모바일 우선</text>
  <rect x="554" y="504" width="212" height="86" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="660" y="528" font-size="12.5" font-weight="800" fill="#DC2626" text-anchor="middle">🔥 Firebase</text>
  <text x="660" y="548" font-size="9.5" fill="#555555" text-anchor="middle">NoSQL · 모바일 SDK·오프라인 강세</text>
  <text x="660" y="566" font-size="9.5" fill="#555555" text-anchor="middle">설정 최소 — 가장 빠른 출발</text>
  <text x="660" y="582" font-size="9.5" fill="#991B1B" text-anchor="middle">→ 관계형으로 이사는 재설계급 (§9-C)</text>

  <!-- 특수 케이스 -->
  <rect x="30" y="608" width="840" height="94" rx="12" fill="#FFFFFF" stroke="#B5AFA5" stroke-width="1.5"/>
  <text x="450" y="632" font-size="13" font-weight="800" fill="#002C5F" text-anchor="middle">트리 밖의 특수 케이스 — 메인 DB에 "곁들이는" 것들</text>
  <rect x="52" y="644" width="188" height="44" rx="9" fill="#FEE2E2"/>
  <text x="146" y="662" font-size="10.5" font-weight="800" fill="#DC2626" text-anchor="middle">캐시·세션·랭킹</text>
  <text x="146" y="679" font-size="9.5" fill="#555555" text-anchor="middle">→ Redis (§3-1)</text>
  <rect x="252" y="644" width="188" height="44" rx="9" fill="#F3E8FF"/>
  <text x="346" y="662" font-size="10.5" font-weight="800" fill="#6B21A8" text-anchor="middle">구조가 자주 바뀌는 데이터</text>
  <text x="346" y="679" font-size="9.5" fill="#555555" text-anchor="middle">→ Postgres의 JSONB로 대개 해결</text>
  <rect x="452" y="644" width="188" height="44" rx="9" fill="#E8EEF7"/>
  <text x="546" y="662" font-size="10.5" font-weight="800" fill="#002C5F" text-anchor="middle">파일·이미지·영상</text>
  <text x="546" y="679" font-size="9.5" fill="#555555" text-anchor="middle">→ S3 계열 스토리지 (§6)</text>
  <rect x="652" y="644" width="196" height="44" rx="9" fill="#E6F7F1"/>
  <text x="750" y="662" font-size="10.5" font-weight="800" fill="#065F46" text-anchor="middle">AI 임베딩·유사도 검색</text>
  <text x="750" y="679" font-size="9.5" fill="#555555" text-anchor="middle">→ pgvector (Postgres 확장)</text>

  <!-- 하단 -->
  <rect x="30" y="716" width="840" height="58" rx="12" fill="#0D1B2E"/>
  <text x="450" y="740" font-size="12.5" font-weight="800" fill="#FFF" text-anchor="middle">읽는 법: 대부분의 개인·소규모 프로젝트는 SQLite · Supabase · Firebase 셋 중 하나로 수렴한다</text>
  <text x="450" y="762" font-size="11" fill="#AAB9CF" text-anchor="middle">Q5에서 "잘 모르겠다"면 Supabase — 관계형은 나중에 문서형처럼 쓸 수 있지만(JSONB) 그 반대는 재설계다</text>
</svg>
